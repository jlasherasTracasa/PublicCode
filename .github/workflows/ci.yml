name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain de rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (build, tests portables, humo)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain de rust-toolchain.toml
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests portables (sin shell de Unix)
        run: cargo test -p pcode-config -p pcode-models -p pcode-policy -p pcode-protocol -p pcode-skills -p pcode-store -p pcode-server -p pcode-tui -p pcode-lsp && cargo test -p pcode-sandbox worktree && cargo test -p pcode-cli --test chat && cargo test -p pcode-cli --test run n0 && cargo test -p pcode-core --test seguridad
      - run: cargo build --release -p pcode-cli
      - name: Prueba de humo de pcode.exe
        shell: pwsh
        run: |
          $exe = "$PWD\target\release\pcode.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $d = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "humo")
          $script = @'
          [{"message":{"role":"assistant","content":"","tool_calls":[{"id":"1","name":"escribir","arguments":{"path":"hola.txt","content":"desde Windows"}}]},"usage":{"input_tokens":1,"output_tokens":1,"cached_input_tokens":0},"stop_reason":"ToolUse"},
           {"message":{"role":"assistant","content":"listo","tool_calls":[]},"usage":{"input_tokens":1,"output_tokens":1,"cached_input_tokens":0},"stop_reason":"EndTurn"}]
          '@
          Set-Content -Path (Join-Path $d "guion.json") -Value $script -Encoding utf8NoBOM
          Push-Location $d
          $env:PCODE_MOCK_SCRIPT = Join-Path $d "guion.json"
          & $exe run "crea hola.txt"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-Content hola.txt) -ne "desde Windows") { Write-Error "hola.txt no tiene el contenido esperado"; exit 1 }
          if (-not (Test-Path .pcode\audit.jsonl)) { Write-Error "falta la auditoría"; exit 1 }
          Remove-Item Env:PCODE_MOCK_SCRIPT
          # Sin clave, doctor informa y sale con 1: se comprueba que lo explica.
          $out = & $exe doctor 2>&1 | Out-String
          if ($out -notmatch "ANTHROPIC_API_KEY") { Write-Error "doctor no explica cómo configurar: $out"; exit 1 }
          $global:LASTEXITCODE = 0
          Pop-Location
      - name: Instalador de Windows (install.ps1 con un .zip local)
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "pcode-vtest-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Copy-Item target\release\pcode.exe, install.ps1 -Destination $pkg
          $zip = "$pkg.zip"
          Compress-Archive -Path $pkg -DestinationPath $zip
          $sum = (Get-FileHash -Algorithm SHA256 $zip).Hash
          ./install.ps1 -Zip $zip -Sha256 $sum
          $installed = Join-Path $env:LOCALAPPDATA "PublicCode\bin\pcode.exe"
          & $installed --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Reinstalar con pcode ya instalado (actualización) también debe funcionar.
          ./install.ps1 -Zip $zip -Sha256 $sum
          & $installed config ruta
          if ($LASTEXITCODE -ne 0) { exit 1 }

  android:
    name: Android (tests, lint y APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Tests, lint y APK
        run: gradle -p apps/android --no-daemon testDebugUnitTest lintDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pcode-android-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk

  python:
    name: Tools de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tools/minisandbox/test_minisandbox.py -v && python3 -m unittest tools/bench/test_reglas.py -v

  plan:
    name: Plan de tareas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tareas/generar.py --comprobar
