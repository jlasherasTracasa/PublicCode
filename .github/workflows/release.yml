name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (p. ej. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Binario ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: pcode.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: pcode
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install; rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Compilar
        shell: bash
        run: cargo build --release --locked -p pcode-cli --target ${{ matrix.target }}
      - name: Prueba de humo
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.exe }} --version
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "pcode-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/pcode.exe, README.md, install.ps1 -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="pcode-$TAG-${{ matrix.target }}"
          mkdir "$name" && cp target/${{ matrix.target }}/release/pcode README.md install.sh "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: pcode-${{ matrix.target }}
          path: |
            pcode-*.zip
            pcode-*.tar.gz

  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Keystore de firma (si hay secretos)
        env:
          KEYSTORE_B64: ${{ secrets.PCODE_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pcode.jks"
            echo "PCODE_ANDROID_KEYSTORE=$RUNNER_TEMP/pcode.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin PCODE_ANDROID_KEYSTORE_B64: el APK se firma con la clave de depuración"
          fi
      - name: Compilar el APK
        env:
          PCODE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PCODE_ANDROID_KEYSTORE_PASSWORD }}
          PCODE_ANDROID_KEY_ALIAS: ${{ secrets.PCODE_ANDROID_KEY_ALIAS }}
          PCODE_ANDROID_KEY_PASSWORD: ${{ secrets.PCODE_ANDROID_KEY_PASSWORD }}
          PCODE_VERSION_CODE: ${{ github.run_number }}
        run: |
          export PCODE_VERSION_NAME="${TAG#v}"
          gradle -p apps/android --no-daemon testDebugUnitTest assembleRelease
          cp apps/android/app/build/outputs/apk/release/app-release.apk "pcode-$TAG-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pcode-android
          path: pcode-*-android.apk

  publish:
    name: Publicar la release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256
        run: cd dist && sha256sum pcode-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PublicCode ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/pcode-*
            dist/SHA256SUMS

  verify-install:
    name: Instalar la release recién publicada (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux (install.sh por tubería)
        if: runner.os == 'Linux'
        run: |
          PCODE_VERSION="$TAG" sh < install.sh
          "$HOME/.local/bin/pcode" --version | grep -q "${TAG#v}"
          "$HOME/.local/bin/pcode" config ruta
      - name: Windows (install.ps1 con irm | iex)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PCODE_VERSION = $env:TAG
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          $v = & (Join-Path $env:LOCALAPPDATA "PublicCode\bin\pcode.exe") --version
          if ($v -notmatch $env:TAG.TrimStart("v")) { Write-Error "versión inesperada: $v"; exit 1 }
