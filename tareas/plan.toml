objetivo = '''
1. `rusqlite` con `bundled`. Esquema versionado con `PRAGMA user_version`:
   `sessions(id INTEGER PK, created_ms, model TEXT, task TEXT, outcome TEXT NULL)` y
   `events(id INTEGER PK, session_id REF, ts_ms, kind TEXT, payload TEXT /* JSON */)`.
2. `open` crea el archivo y migra; `open_in_memory` para tests.
3. API síncrona (el bucle la usará con `spawn_blocking`).
'''
firmas = '''
#[derive(Debug, thiserror::Error)]
pub enum StoreError { #[error("sqlite: {0}")] Sql(#[from] rusqlite::Error), #[error("json: {0}")] Json(#[from] serde_json::Error) }

#[derive(Debug, Clone, PartialEq)]
pub struct Event { pub id: i64, pub session_id: i64, pub ts_ms: i64, pub kind: String, pub payload: serde_json::Value }

#[derive(Debug, Clone, PartialEq)]
pub struct SessionRow { pub id: i64, pub created_ms: i64, pub model: String, pub task: String, pub outcome: Option<String> }

pub struct Store { /* conn */ }
impl Store {
    pub fn open(path: &std::path::Path) -> Result<Store, StoreError>;
    pub fn open_in_memory() -> Result<Store, StoreError>;
    pub fn create_session(&self, model: &str, task: &str) -> Result<i64, StoreError>;
    pub fn finish_session(&self, id: i64, outcome: &str) -> Result<(), StoreError>;
    pub fn append_event(&self, session_id: i64, kind: &str, payload: &serde_json::Value) -> Result<i64, StoreError>;
    pub fn events(&self, session_id: i64) -> Result<Vec<Event>, StoreError>;
    pub fn sessions(&self, limit: u32) -> Result<Vec<SessionRow>, StoreError>;
}
'''
