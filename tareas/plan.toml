[[tarea]]
id = "F1.21"
nombre = "detector-atasco"
titulo = "Detector de atasco, pistas por fallo típico y parada temprana"
fase = "F1"
ejecutor = "haiku"
depende = ["F1.18"]
toca = ["crates/pcode-core/src/lib.rs", "crates/pcode-core/src/stuck.rs", "crates/pcode-core/src/agent.rs"]
acepta = "cargo test -p pcode-core stuck"
contexto = ["crates/pcode-core/src/agent.rs"]
objetivo = '''
1. `StuckDetector::observe(call, output)` devuelve una señal cuando:
   - la misma llamada (nombre + args en JSON canónico) se repite `max_repeats` veces seguidas;
   - el mismo error (primeras 200 letras de una salida con `is_error`) se repite `max_repeats` veces;
   - pasan `max_steps_without_write` pasos sin ninguna tool con efecto Write.
2. `hint_for(output)`: tabla de pistas por fallo típico, por ejemplo:
   - "no se encontró el texto a reemplazar" → "Vuelve a leer el archivo con `leer` antes de editar.";
   - "rustfmt" o "cargo fmt" → "Ejecuta `cargo fmt --all`.";
   - "unresolved import" → "Revisa el `use` y que el módulo esté declarado en lib.rs.";
   - "denegado por la política" → "Esa acción no está permitida; busca otra forma o explica el bloqueo en el informe."
3. En el bucle: la primera señal añade un mensaje de usuario con la pista; la segunda termina con
   `Outcome::Stuck(motivo)`.
'''
firmas = '''
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum StuckSignal { RepeatedCall(String), RepeatedError(String), NoProgress(u32) }

pub struct StuckDetector { /* window state */ }
impl StuckDetector {
    pub fn new(max_repeats: u32, max_steps_without_write: u32) -> Self;
    pub fn observe(&mut self, call: &pcode_models::ToolCall, wrote: bool, output: &pcode_tools::ToolOutput) -> Option<StuckSignal>;
}
pub fn hint_for(output: &str) -> Option<&'static str>;
'''
tests = ["stuck_llamada_repetida", "stuck_error_repetido", "stuck_sin_progreso", "stuck_se_reinicia_al_escribir", "hint_editar", "agente_para_con_stuck_tras_dos_senales"]
papers = ["EET (Findings ACL 2026): terminación temprana", "PRFC (Findings EMNLP 2026)", "FAMA (Findings ACL 2026): contexto contra fallos típicos"]

