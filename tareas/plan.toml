contexto = ["docs/arquitectura.md (sección «Modelos»)"]
objetivo = '''
Tipos comunes a todos los proveedores. `lib.rs` declara `pub mod types; pub use types::*;`.
Todo serializable con serde. Constructores de conveniencia en `Message`.
'''
firmas = '''
use serde::{Deserialize, Serialize};

#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]
#[serde(rename_all = "snake_case")]
pub enum Role { System, User, Assistant, Tool }

#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
pub struct ToolCall { pub id: String, pub name: String, pub arguments: serde_json::Value }

#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
pub struct Message {
    pub role: Role,
    pub content: String,
    #[serde(default, skip_serializing_if = "Vec::is_empty")]
    pub tool_calls: Vec<ToolCall>,
    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub tool_call_id: Option<String>,
}

impl Message {
    pub fn system(text: impl Into<String>) -> Self;
    pub fn user(text: impl Into<String>) -> Self;
    pub fn assistant(text: impl Into<String>) -> Self;
    pub fn tool_result(call_id: impl Into<String>, content: impl Into<String>) -> Self;
}

#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
pub struct ToolSpec { pub name: String, pub description: String, pub parameters: serde_json::Value }

#[derive(Debug, Clone, PartialEq, Serialize, Deserialize, Default)]
pub struct ChatRequest {
    pub model: String,
    pub messages: Vec<Message>,
    pub tools: Vec<ToolSpec>,
    pub max_tokens: Option<u32>,
    pub temperature: Option<f32>,
}

#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, Default)]
pub struct Usage { pub input_tokens: u64, pub output_tokens: u64, pub cached_input_tokens: u64 }
impl Usage { pub fn add(&mut self, other: &Usage); }

#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
pub enum StopReason { EndTurn, ToolUse, MaxTokens, Other(String) }

#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]
pub struct ChatResponse { pub message: Message, pub usage: Usage, pub stop_reason: StopReason }
'''
tests = [
  "message_constructores: cada constructor pone el rol correcto",
  "message_serializa_sin_campos_vacios: un Message::user no incluye tool_calls ni tool_call_id en el JSON",
  "tool_result_lleva_id",
  "usage_add_suma_los_tres_campos",
  "chat_response_ida_y_vuelta_json",
]

[[tarea]]
id = "F1.03"
nombre = "provider-mock"
titulo = "Trait `Provider`, errores y `MockProvider` con guion"
fase = "F1"
ejecutor = "haiku"
depende = ["F1.02"]
toca = ["crates/pcode-models/Cargo.toml", "crates/pcode-models/src/lib.rs", "crates/pcode-models/src/provider.rs", "crates/pcode-models/src/mock.rs"]
acepta = "cargo test -p pcode-models"
contexto = ["crates/pcode-models/src/types.rs"]
objetivo = '''
1. `provider.rs`: `ModelError` y el trait asíncrono `Provider` (con `async-trait`).
2. `mock.rs`: `MockProvider` devuelve respuestas en orden desde un guion y guarda las peticiones que
   recibe (para los tests del bucle). Cuando se agota el guion, devuelve `ModelError::MockExhausted`.
3. `MockProvider::from_script_file(path)` lee un JSON con un array de `ChatResponse`. Lo usa la CLI con
   la variable `PCODE_MOCK_SCRIPT`.
4. Re-exporta todo en `lib.rs`.
'''
firmas = '''
#[derive(Debug, thiserror::Error)]
pub enum ModelError {
    #[error("error HTTP: {0}")] Http(String),
    #[error("respuesta inválida: {0}")] InvalidResponse(String),
    #[error("límite de peticiones del proveedor")] RateLimited,
    #[error("el guion del mock se ha agotado")] MockExhausted,
}

#[async_trait::async_trait]
pub trait Provider: Send + Sync {
    fn name(&self) -> &str;
    async fn chat(&self, req: &ChatRequest) -> Result<ChatResponse, ModelError>;
}

pub struct MockProvider { /* Mutex<VecDeque<ChatResponse>>, Mutex<Vec<ChatRequest>> */ }
impl MockProvider {
    pub fn new(script: Vec<ChatResponse>) -> Self;
    pub fn from_script_file(path: &std::path::Path) -> Result<Self, ModelError>;
    pub fn requests(&self) -> Vec<ChatRequest>;
}
'''
tests = [
  "mock_devuelve_en_orden",
  "mock_agotado_da_error",
  "mock_guarda_peticiones",
  "mock_desde_archivo: escribe un JSON en un tempdir y lo carga",
]

