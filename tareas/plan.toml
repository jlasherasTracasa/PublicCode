# Índice del plan de implementación de PublicCode.
#
# Aquí van solo las fases y los hitos. Las tareas están en tareas/plan/F<n>.toml (una fase por archivo).
# Tras cualquier cambio: tools/tareas/generar.py (regenera tareas/*.md y docs/implementacion.md).
# Cómo escribir una tarea: docs/tareas-guia.md.

# ── Fases: agrupan las tareas por tema. El número es parte del id de la tarea (F8.14 → fase F8). ──

