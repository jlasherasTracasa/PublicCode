[[tarea]]
id = "F0.04a"
nombre = "bench-conjunto-validador"
titulo = "Banco: formato de `bench/*.jsonl` y validador `tools/bench/conjunto.py`"
fase = "F0"
hito = "1.4"
talla = "S"
ejecutor = "haiku"
depende = []
toca = ["tools/bench/conjunto.py", "tools/bench/test_conjunto.py"]
acepta = "python3 -m unittest tools/bench/test_conjunto.py"
contexto = [
  ".claude/skills/banco/SKILL.md (ejemplo de una línea JSON del conjunto `smoke`)",
  "tools/bench/reglas.py (estilo: docstring de uso, `argparse`, funciones puras, `subprocess` para git)",
]
objetivo = '''
1. Crea `conjunto.py` (ejecutable, `#!/usr/bin/env python3`, solo biblioteca estándar) con las funciones de
   abajo. Un conjunto es un archivo JSONL: una línea JSON por tarea con los campos de texto obligatorios `id`,
   `acepta`, `tarea`, `base`, `aceptada_en` y el opcional `cadena`. Se admiten campos de más.
2. `validar_linea(obj)`: problemas de un objeto ya parseado: `falta <campo>` (ausente, no es texto o vacío);
   `tarea debe ser un .md`; `base no es un commit` / `aceptada_en no es un commit` (deben ser hexadecimales de
   7 a 40 caracteres); `base y aceptada_en son iguales`.
3. `validar(texto, n=None)`: recorre las líneas no vacías; cada problema va precedido de `línea <k>: `
   (k empieza en 1). Añade `línea <k>: no es JSON`, `línea <k>: id repetido <id>` y, si se da `n` y el número
   de líneas es otro, `se esperaban <n> tareas y hay <m>`.
4. `validar_git(texto, repo)`: por cada línea válida comprueba con `git -C repo cat-file -e <sha>^{commit}`
   que `base` y `aceptada_en` existen: `línea <k>: no existe el commit <sha>`.
5. `main(argv)`: `conjunto.py [--n N] [--git] [--repo R] ARCHIVO`; problemas a stderr, código 1 si hay alguno.
6. Crea `test_conjunto.py` con los tests de la lista; el de git crea un repo temporal con
   `subprocess.run(["git", "init", …])` y un commit.
'''
lenguaje = "python"
firmas = '''
# tools/bench/conjunto.py
CAMPOS = ("id", "acepta", "tarea", "base", "aceptada_en")

def validar_linea(obj: dict) -> list[str]: ...
def validar(texto: str, n: int | None = None) -> list[str]: ...
def validar_git(texto: str, repo: str) -> list[str]: ...
def main(argv=None) -> int: ...
'''
ejemplo = '''
ok = {"id": "F1.09-tool-leer", "acepta": "cargo test -p pcode-tools read", "tarea": "tareas/F1.09-tool-leer.md",
      "base": "a1b2c3d", "aceptada_en": "e4f5a6b"}
validar_linea(ok) → []
validar_linea({**ok, "base": "zzz"}) → ["base no es un commit"]
validar(json.dumps(ok) + "\n" + json.dumps(ok) + "\n", n=20)
  → ["línea 2: id repetido F1.09-tool-leer", "se esperaban 20 tareas y hay 2"]
'''
tests = [
  "test_linea_valida: el objeto del ejemplo no da problemas",
  "test_falta_campo: sin `acepta` da `falta acepta`",
  "test_commit_no_hexadecimal: base `zzz` da `base no es un commit`",
  "test_id_repetido_y_numero: las dos líneas del ejemplo dan los dos problemas del ejemplo",
  "test_linea_que_no_es_json: una línea `{` da `línea 1: no es JSON`",
  "test_git_commit_inexistente: en un repo temporal, un sha inventado da `no existe el commit`",
  "test_main_codigos: main devuelve 0 con un archivo válido y 1 con uno inválido",
]
no_hagas = ["No ejecutes las órdenes `acepta` de las tareas", "No uses dependencias fuera de la biblioteca estándar"]

[[tarea]]
id = "F0.04b"
nombre = "bench-extraer-candidatas"
titulo = "Banco: `tools/bench/extraer.py` saca las tareas candidatas del historial de git"
fase = "F0"
hito = "1.4"
talla = "M"
ejecutor = "haiku"
depende = ["F0.04a"]
toca = ["tools/bench/extraer.py", "tools/bench/test_extraer.py"]
acepta = "python3 -m unittest tools/bench/test_extraer.py"
contexto = [
  "tools/bench/reglas.py (función `archivos_tocados`: cómo se llama a git con `subprocess`)",
  "tools/bench/conjunto.py (formato de cada línea: `id`, `acepta`, `tarea`, `base`, `aceptada_en`)",
  "tareas/F3.10-cli-flow.md (cabecera `<!-- acepta: … -->` de un archivo de tarea)",
]
objetivo = '''
Una tarea hecha tiene `informes/<id>.md`. El commit que AÑADIÓ ese informe es `aceptada_en` y su padre es `base`.
1. Crea `extraer.py` (ejecutable, `#!/usr/bin/env python3`, solo biblioteca estándar) con las funciones de abajo.
2. `acepta_de(md)`: devuelve el texto de la cabecera `<!-- acepta: … -->` (primeras 12 líneas) o `None`.
3. `crates_de(rutas)`: nombres distintos y ordenados de los crates tocados (`crates/<nombre>/…` → `<nombre>`).
4. `candidata(repo, id)`: usa git (`subprocess.run([... "git", "-C", repo, …], capture_output=True, text=True)`):
   - `aceptada_en` = última línea de `git log --diff-filter=A --format=%H -- informes/<id>.md`; sin salida → `None`;
   - `base` = `git rev-parse <aceptada_en>^`; si falla (commit raíz) → `None`;
   - el texto de la tarea = `git show <aceptada_en>:tareas/<id>.md`; si falla o no tiene `acepta` → `None`;
   - `crates` = `crates_de` sobre `git diff --name-only <base> <aceptada_en>`.
   Devuelve `{"id", "acepta", "tarea": "tareas/<id>.md", "base", "aceptada_en", "crates"}`.
5. `main(argv)`: `extraer.py [--repo R]`; recorre `informes/*.md` de `R` en orden alfabético (id = nombre sin
   `.md`), imprime una línea JSON por candidata (`ensure_ascii=False`) y, en stderr, `omitida: <id>` por cada
   `None`. Devuelve 0.
6. Crea `test_extraer.py`: los tests de git montan un repo temporal con dos commits (el primero con
   `tareas/T1.md`; el segundo añade `informes/T1.md` y `crates/x/src/lib.rs`).
'''
lenguaje = "python"
firmas = '''
# tools/bench/extraer.py
def acepta_de(md: str) -> str | None: ...
def crates_de(rutas: list[str]) -> list[str]: ...
def candidata(repo: str, id_tarea: str) -> dict | None: ...
def main(argv=None) -> int: ...
'''
ejemplo = '''
acepta_de("<!-- acepta: cargo test -p x -->\n# T1\n") → "cargo test -p x"
crates_de(["crates/pcode-flow/src/a.rs", "crates/pcode-cli/src/b.rs", "docs/x.md", "crates/pcode-flow/Cargo.toml"])
  → ["pcode-cli", "pcode-flow"]
candidata(repo_temporal, "T1") → {"id": "T1", "acepta": "true", "tarea": "tareas/T1.md",
  "base": "<sha del primer commit>", "aceptada_en": "<sha del segundo>", "crates": ["x"]}
'''
tests = [
  "test_acepta_de_la_cabecera: la entrada del ejemplo devuelve la orden; un texto sin cabecera devuelve None",
  "test_crates_distintos_y_ordenados: la lista del ejemplo devuelve los dos crates",
  "test_candidata_con_base_y_aceptada: en el repo temporal los dos commits salen en su sitio y crates es x",
  "test_sin_informe_no_hay_candidata: un id sin informe devuelve None",
  "test_main_imprime_jsonl: main sobre el repo temporal imprime una línea JSON que pasa `conjunto.validar_linea`",
]
no_hagas = ["No ejecutes `acepta`", "No escribas `bench/smoke.jsonl`: la selección es de la tarea F0.04", "No uses dependencias fuera de la biblioteca estándar"]

