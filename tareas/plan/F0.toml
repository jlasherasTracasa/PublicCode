# Tareas de la fase F0. Índice de fases e hitos: tareas/plan.toml. Tras editar: tools/tareas/generar.py

[[tarea]]
id = "F0.01"
nombre = "workspace"
titulo = "Workspace Rust y binario `pcode --version`"
fase = "F0"
ejecutor = "haiku"
depende = []
toca = ["Cargo.toml", "rust-toolchain.toml", "crates/pcode-cli/Cargo.toml", "crates/pcode-cli/src/main.rs"]
acepta = "cargo build -p pcode-cli && ./target/debug/pcode --version | grep -qE 'pcode [0-9]+[.][0-9]+[.][0-9]+'"
contexto = ["AGENTS.md (convenciones y dependencias permitidas)", "README.md (sección «Estructura del repositorio»)"]
objetivo = '''
1. `Cargo.toml` raíz: workspace con `resolver = "3"`, `members = ["crates/*"]`, y
   `[workspace.package]` con `version = "0.1.0"`, `edition = "2024"`, `license = "Apache-2.0"`.
   Añade `[workspace.dependencies]` con versiones fijadas de: tokio (features `full`), serde (`derive`),
   serde_json, toml, thiserror, anyhow, clap (`derive`), tracing, tracing-subscriber, async-trait.
2. `rust-toolchain.toml`: canal estable con una versión exacta (la instalada: `rustc -V`) y
   componentes `rustfmt` y `clippy`.
3. `crates/pcode-cli`: binario llamado `pcode` (`[[bin]] name = "pcode"`), dependencias desde el
   workspace (`clap.workspace = true`, …).
4. `main.rs`: CLI con clap derive; `--version` imprime `pcode 0.1.0` (usa `env!("CARGO_PKG_VERSION")`).
   Sin subcomandos todavía; sin argumentos imprime la ayuda y sale con 0.
'''
firmas = '''
// crates/pcode-cli/src/main.rs
use clap::Parser;

/// PublicCode: programación agéntica con varios agentes.
#[derive(Debug, Parser)]
#[command(name = "pcode", version, about)]
struct Cli {}

fn main() -> anyhow::Result<()>;
'''
tests = ["(sin tests unitarios): la aceptación comprueba el binario"]

