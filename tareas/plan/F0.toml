ejecutor = "coordinador"
depende = ["F0.02", "F1.20"]
toca = [".github/workflows/ci.yml", ".github/workflows/release.yml", "install.ps1", "install.sh"]
acepta = "grep -q 'windows-latest' .github/workflows/ci.yml && grep -q 'x86_64-pc-windows-msvc' .github/workflows/release.yml && grep -q 'SHA256SUMS' .github/workflows/release.yml && test -x install.sh && test -s install.ps1"
contexto = ["AGENTS.md (sección 8, plataformas)", "README.md (sección «Instalación»)"]
objetivo = '''
1. `ci.yml`: además de `rust` en Linux, un job `windows` (`windows-latest`) con clippy de todo el
   workspace, tests de los crates portables y una prueba de humo de `pcode.exe run` con un guion
   simulado (crea un archivo y escribe `.pcode\audit.jsonl`).
2. `release.yml`: al subir una etiqueta `v*` (o a mano), compila `pcode` para
   `x86_64-pc-windows-msvc` (zip con `install.ps1`) y `x86_64-unknown-linux-gnu` (tar.gz con
   `install.sh`), calcula `SHA256SUMS` y publica la release de GitHub.
3. `install.ps1`: instalación por usuario en `%LOCALAPPDATA%\PublicCode\bin` y PATH de usuario;
   `install.sh`: en `~/.local/bin`. Ambos verifican el SHA-256 si se les pasa.
'''
tests = ["(CI): los jobs `windows` y `linux` en verde; la release publica los dos archivos y `SHA256SUMS`"]

[[tarea]]
id = "F0.08"
nombre = "instalacion"
titulo = "Instalación en una línea, `pcode doctor`, `pcode config` y `pcode actualizar`"
fase = "F0"
ejecutor = "coordinador"
depende = ["F0.07"]
toca = ["install.sh", "install.ps1", "crates/pcode-cli/src/doctor.rs", "crates/pcode-cli/src/update.rs", "crates/pcode-cli/src/main.rs", ".github/workflows/ci.yml", ".github/workflows/release.yml", "Cargo.toml"]
acepta = "cargo test -p pcode-cli doctor && cargo test -p pcode-cli update && sh -n install.sh && grep -q 'verify-install' .github/workflows/release.yml"
contexto = ["README.md (sección «Instalación»)", "install.sh", "install.ps1"]
objetivo = '''
1. `install.sh` (`curl … | sh`) e `install.ps1` (`irm … | iex`): por usuario, última release (o
   `PCODE_VERSION`), verificación con `SHA256SUMS`, PATH del usuario, actualizables con pcode abierto.
2. `pcode doctor`: versión, configuraciones leídas, modelo elegido, claves presentes (sin mostrarlas),
   git, shell, sandbox N1 y agentes externos; sale con 1 si no hay modelo.
3. `pcode config ruta|init|mostrar` y `pcode actualizar [--comprobar]` (descarga, SHA-256 y sustitución
   del binario en marcha; en Windows renombrando el antiguo).
4. Perfil release con LTO fina, una unidad de código y sin símbolos.
5. CI: `install.ps1` con un .zip local en Windows; release: prueba los dos instaladores contra lo publicado.
'''
tests = ["la_plantilla_es_toml_valido_y_carga_vacia", "elige_el_archivo_de_la_plataforma", "lee_sha256sums_y_compara_versiones", "(CI) instalador de Windows y verify-install"]
