[[tarea]]
id = "F1.26"
nombre = "robustez"
titulo = "Robustez para el uso diario: reintentos, caché de prompt, compactación, política segura y configuración global"
fase = "F1"
ejecutor = "coordinador"
depende = ["F1.25", "F5.29"]
toca = ["crates/pcode-models/src/retry.rs", "crates/pcode-models/src/anthropic.rs", "crates/pcode-core/src/agent.rs", "crates/pcode-policy/src/caps.rs", "crates/pcode-config/src/lib.rs", "crates/pcode-cli/src/provider.rs", "crates/pcode-cli/src/chat.rs", "crates/pcode-tui/src/app.rs", "crates/pcode-tui/src/run.rs"]
acepta = "cargo test -p pcode-models retry && cargo test -p pcode-core compacta && cargo test -p pcode-policy interactivo && cargo test -p pcode-config merge"
contexto = ["crates/pcode-core/src/agent.rs", "crates/pcode-policy/src/caps.rs"]
objetivo = '''
1. `RetryProvider`: 4 intentos con espera exponencial ante 429, 5xx, 408 y fallos de red; en streaming
   solo si aún no se entregó texto.
2. Anthropic: `cache_control` en sistema, última tool y último mensaje.
3. `Budget::max_context_tokens` y `Agent::compact`: resumen con el propio modelo, conservando sistema y
   últimos mensajes sin separar llamadas de sus resultados; `/compactar` en la TUI y en el chat.
4. `Capabilities::interactive_defaults` y `preguntar_ordenes`: deniega lo catastrófico y pregunta lo
   destructivo; la configuración del usuario solo endurece.
5. Configuración global (`user_config_path`, `Config::merge`, `[preferencias]`) y raíces TLS del sistema.
'''
tests = ["reintenta_429_y_5xx_hasta_acertar", "no_reintenta_un_400_ni_pasa_del_maximo", "compacta_cuando_se_supera_el_limite_sin_romper_pares_de_tools", "interactivo_pregunta_lo_destructivo_y_deniega_lo_catastrofico", "merge_proyecto_manda_y_global_rellena", "load_layered_lee_pcode_config", "anthropic_peticion_separa_system_y_agrupa_resultados"]
