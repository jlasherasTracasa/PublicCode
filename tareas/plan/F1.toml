[[tarea]]
id = "F1.11"
nombre = "tool-buscar"
titulo = "Tools `buscar` (regex) y `listar` (glob) ignorando .git y target"
fase = "F1"
ejecutor = "haiku"
depende = ["F1.08"]
toca = ["crates/pcode-tools/Cargo.toml", "crates/pcode-tools/src/lib.rs", "crates/pcode-tools/src/search.rs"]
acepta = "cargo test -p pcode-tools search"
contexto = ["crates/pcode-tools/src/registry.rs"]
objetivo = '''
1. `Grep` (`buscar`, `[Read]`): `{"pattern", "path"?, "glob"?, "max_results"?: 200}`. Recorre
   directorios con `std::fs` (sin dependencias nuevas salvo `regex` y `globset`), saltando `.git`,
   `target`, `node_modules` y `.pcode`. Salta archivos binarios. Salida: `ruta:línea:texto`, con las
   rutas relativas a root, ordenadas; si hay más de `max_results`, corta y avisa.
2. `Glob` (`listar`, `[Read]`): `{"pattern"}` (p. ej. `crates/**/*.rs`) → rutas relativas ordenadas,
   hasta 1000.
'''
firmas = '''
pub struct Grep;
