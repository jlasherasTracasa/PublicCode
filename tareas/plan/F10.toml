mcp = { github: orden ["npx","-y","srv"], viejo: orden ["x"], desactivado }:
  "Servidores MCP (2):\n  · github: npx -y srv\n  · viejo: x (desactivado)\npcode mcp muestra las tools de cada uno."
permissions_text(&[("proyecto", Capabilities { write: vec!["src/**".into()], ..Default::default() }), ("usuario", Capabilities::default())]) ==
  "proyecto:\n  escribir: src/**\nusuario:\n  (sin reglas)"
'''
