  "crates/pcode-flow/src/events.rs (`FlowEvent`, `FlowState::replay`: el estado se reconstruye de los eventos)",
  "crates/pcode-flow/src/scheduler.rs (función `plan`: una tarea `Running` o `Accepted` cuenta como en marcha y no se relanza)",
  "crates/pcode-flow/src/runner.rs (`Runner::state`, `Runner::emit` y el test `estado_md_tiene_secciones`: runner sin sandbox)",
