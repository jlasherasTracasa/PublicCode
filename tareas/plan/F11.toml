[[tarea]]
id = "F11.06a"
nombre = "presupuesto-nucleo"
titulo = "Flujos: `FlowBudget` y `Spent` (lógica pura)"
fase = "F11"
hito = "1.4"
talla = "S"
ejecutor = "haiku"
depende = ["F11.05"]
toca = ["crates/pcode-flow/src/budget.rs", "crates/pcode-flow/src/lib.rs"]
