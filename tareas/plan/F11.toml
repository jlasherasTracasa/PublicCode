  ## Objetivo
  1. Crea a.rs con una función. {"Detalle del paso. ".repeat(20)}
  2. Comprueba que compila.
  ## Firmas
  (bloque de código con) pub fn a();
  ## Tests
  - `crea_a`: tras la tarea existe a.rs con la función
lint_task(valida) → []
Quitando la sección Firmas → [LintIssue { rule: "firmas", .. }]
'''
