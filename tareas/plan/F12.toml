[[tarea]]
id = "F12.03a"
nombre = "secretos-escritura"
titulo = "Agente: escribir un archivo que contiene un secreto requiere aprobación"
fase = "F12"
hito = "1.5"
talla = "S"
ejecutor = "haiku"
depende = ["F12.02"]
