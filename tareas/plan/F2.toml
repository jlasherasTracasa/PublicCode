#[derive(Debug, Clone, PartialEq)] pub struct Field { pub name: String, pub ty: String, pub doc: String }
#[derive(Debug, Clone, PartialEq)] pub struct Contract { pub inputs: Vec<Field>, pub outputs: Vec<Field>, pub example: String, pub checkpoints: Vec<String> }
pub fn parse_contract(body: &str) -> Result<Option<Contract>, SkillError>;
pub fn lint(skill: &Skill) -> Vec<String>;
'''
