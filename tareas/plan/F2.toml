[[tarea]]
id = "F2.13"
nombre = "skills-registro"
titulo = "`pcode-skills`: leer `SKILL.md`, registro, índice y cierre de dependencias"
fase = "F2"
ejecutor = "haiku"
depende = ["F0.01"]
toca = ["crates/pcode-skills/Cargo.toml", "crates/pcode-skills/src/lib.rs", "crates/pcode-skills/src/registry.rs"]
acepta = "cargo test -p pcode-skills registry"
contexto = [".claude/skills/tarea-haiku/SKILL.md (ejemplo real)", "docs/adr/ADR-0004-skills-formato-unico.md"]
objetivo = '''
1. Frontmatter entre `---`: subconjunto de YAML con `clave: valor` y listas `[a, b]` o `- a`. Sin
   dependencia de YAML: parser propio pequeño. Claves: `name` y `description` (obligatorias),
   `depende`, `no_usar_cuando` y `procedencia` (opcionales).
2. `Registry::load(dirs)`: cada subdirectorio con `SKILL.md` es una skill; error si dos tienen el
   mismo `name`.
3. `index()`: texto con una línea `- <name>: <description>` por skill (lo único que entra siempre
   en contexto).
4. `with_dependencies(name)`: la skill y sus `depende`, transitivamente, sin ciclos (si hay ciclo, error).
'''
firmas = '''
#[derive(Debug, Clone, PartialEq)]
pub struct Skill { pub name: String, pub description: String, pub depends: Vec<String>, pub do_not_use_when: Option<String>,
                   pub provenance: Option<String>, pub dir: std::path::PathBuf, pub body: String }
#[derive(Debug, thiserror::Error)]
pub enum SkillError { #[error("E/S: {0}")] Io(#[from] std::io::Error), #[error("{0}: {1}")] Invalid(String, String) }
pub fn parse_skill_md(text: &str, dir: &std::path::Path) -> Result<Skill, SkillError>;
pub struct Registry { /* BTreeMap<String, Skill> */ }
impl Registry {
