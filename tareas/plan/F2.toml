[[tarea]]
id = "F2.19"
nombre = "proxy-salida"
titulo = "`pcode-netproxy`: proxy CONNECT en socket Unix con lista de dominios y auditoría"
fase = "F2"
ejecutor = "haiku"
depende = ["F1.15"]
toca = ["crates/pcode-sandbox/src/netproxy.rs", "crates/pcode-sandbox/src/lib.rs", "crates/pcode-sandbox/Cargo.toml"]
acepta = "cargo test -p pcode-sandbox netproxy"
contexto = ["docs/mini-sandboxes.md (Red)"]
objetivo = '''
1. Escucha en un socket Unix. Acepta `CONNECT host:puerto HTTP/1.1`: si `host:puerto` casa con la
   lista (`*.dominio` admitido; puerto opcional) → `200 Connection established` y túnel
   bidireccional (`tokio::io::copy_bidirectional`); si no → `403` y una entrada de auditoría.
2. Peticiones HTTP planas (`GET http://host:puerto/… HTTP/1.1`): lo mismo, reenviándolas (para
   LiteLLM en `http://127.0.0.1:30400`).
3. Tiempo máximo de inactividad por conexión: 10 minutos.
'''
firmas = '''
pub struct NetProxy { pub socket: std::path::PathBuf, pub allow: Vec<String> }
impl NetProxy { pub async fn serve(self, audit: Option<std::sync::Arc<std::sync::Mutex<pcode_policy::AuditLog>>>) -> std::io::Result<()>; }
pub fn host_allowed(allow: &[String], host: &str, port: u16) -> bool;
'''
tests = ["host_allowed_comodin_y_puerto", "proxy_connect_permitido_hace_tunel (servidor TCP de eco local)", "proxy_connect_denegado_403", "proxy_http_plano_reenvia"]

