[[tarea]]
id = "F2.17a"
nombre = "instrucciones-nucleo"
titulo = "Instrucciones derivadas de AGENTS.md: generar y comprobar (núcleo)"
fase = "F2"
hito = "1.4"
talla = "M"
ejecutor = "haiku"
depende = ["F2.14"]
