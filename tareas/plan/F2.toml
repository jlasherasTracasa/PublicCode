[[tarea]]
id = "F2.01"
nombre = "sandbox-capa"
titulo = "`pcode-sandbox`: leer la capa superior del overlay como lista de cambios"
fase = "F2"
ejecutor = "haiku"
depende = ["F0.01"]
toca = ["crates/pcode-sandbox/Cargo.toml", "crates/pcode-sandbox/src/lib.rs", "crates/pcode-sandbox/src/layer.rs"]
acepta = "cargo test -p pcode-sandbox layer"
contexto = ["tools/minisandbox/minisandbox.py (función leer_cambios: es la referencia a portar)", "docs/mini-sandboxes.md"]
objetivo = '''
Portar `leer_cambios` del prototipo Python:
1. Recorre `upper` (sin seguir enlaces). Un dispositivo de caracteres con rdev 0 → `Deleted`; un
   directorio con xattr `trusted.overlay.opaque` o `user.overlay.opaque` = "y" que existe en `lower`
   → `Replaced`; un directorio vacío que no existe en `lower` → `Added`; un archivo o enlace → `Modified`
   si existe en `lower` y `Added` si no.
2. `filter_ignored`: si `lower/.git` existe, pasa las rutas por `git -C lower check-ignore --stdin`
   y quita las ignoradas.
3. Resultado ordenado por ruta. Rutas relativas con `/`.
4. `nix` solo para `major`/`minor` y xattr (o `std::os::unix::fs::MetadataExt::rdev` + `libc`/`nix::sys::stat`).
'''
firmas = '''
#[derive(Debug, Clone, Copy, PartialEq, Eq, serde::Serialize)]
pub enum ChangeKind { Added, Modified, Deleted, Replaced }

#[derive(Debug, Clone, PartialEq, Eq, serde::Serialize)]
pub struct Change { pub path: String, pub kind: ChangeKind }

pub fn read_changes(upper: &std::path::Path, lower: &std::path::Path) -> std::io::Result<Vec<Change>>;
pub fn filter_ignored(lower: &std::path::Path, changes: Vec<Change>) -> std::io::Result<Vec<Change>>;
'''
tests = [
  "capa_anadido_y_modificado (crea upper y lower a mano en un tempdir)",
  "capa_borrado_whiteout (crea el dispositivo 0/0 con mknod; si da EPERM, el test se salta)",
  "capa_directorio_nuevo_vacio",
  "capa_ordenada",
  "filtra_ignorados_por_git",
]

[[tarea]]
id = "F2.02"
nombre = "sandbox-ejecutar"
titulo = "Ejecutar una orden en N1 (namespaces + overlay + raíz ro) con tiempo máximo"
fase = "F2"
ejecutor = "haiku"
depende = ["F2.01"]
toca = ["crates/pcode-sandbox/Cargo.toml", "crates/pcode-sandbox/src/lib.rs", "crates/pcode-sandbox/src/run.rs", "crates/pcode-sandbox/src/prepare.sh"]
acepta = "cargo test -p pcode-sandbox run"
contexto = ["tools/minisandbox/minisandbox.py (PREPARAR y ejecutar: referencia a portar)", "docs/mini-sandboxes.md"]
objetivo = '''
1. `prepare.sh` = el script `PREPARAR` del prototipo, incluido con `include_str!`.
2. `Sandbox::create(spec)`: crea `state/upper`, `state/work` y, si el repo o el estado están bajo
   `/tmp`, `state/tmp`. Rechaza un estado dentro de `root`.
3. `Sandbox::run(argv, env)`: lanza `unshare --user --map-root-user --mount --pid --fork --kill-child
   --mount-proc [--net] sh -c <prepare.sh> pcode-sandbox <argv…>` con las mismas variables de entorno
   que el prototipo, `kill_on_drop` y el tiempo máximo de `spec.timeout` (vencido → `ExitStatus`
   con código 124 y `timed_out = true`).
4. `userns_available()` prueba `unshare --user --map-root-user --mount true` una vez (`OnceLock`).
5. Los tests se saltan (con un `eprintln!`) si no hay namespaces de usuario.
'''
firmas = '''
#[derive(Debug, Clone, Copy, PartialEq, Eq)] pub enum Network { None, Open, Filtered }
#[derive(Debug, Clone)]
pub struct SandboxSpec { pub root: PathBuf, pub state: Option<PathBuf>, pub network: Network, pub writable: Vec<PathBuf>, pub timeout: Duration }
#[derive(Debug, Clone, PartialEq, Eq)] pub struct RunStatus { pub code: i32, pub timed_out: bool, pub millis: u128 }
#[derive(Debug, thiserror::Error)]
pub enum SandboxError { #[error("E/S: {0}")] Io(#[from] std::io::Error), #[error("namespaces de usuario no disponibles")] NoUserns, #[error("{0}")] Invalid(String) }
pub struct Sandbox { /* spec, state dir */ }
impl Sandbox {
    pub fn create(spec: SandboxSpec) -> Result<Sandbox, SandboxError>;
    pub fn state_dir(&self) -> &Path;
    pub async fn run(&self, argv: &[String], env: &[(String, String)]) -> Result<RunStatus, SandboxError>;
    pub fn changes(&self) -> Result<Vec<Change>, SandboxError>;   // read_changes + filter_ignored
}
pub fn userns_available() -> bool;
'''
tests = ["run_escribe_en_capa_no_en_repo", "run_sin_red", "run_fuera_solo_lectura", "run_timeout_124", "run_estado_dentro_de_root_es_error", "run_repo_bajo_tmp"]

[[tarea]]
id = "F2.03"
nombre = "sandbox-aplicar"
titulo = "Aplicar y descartar los cambios de una sandbox"
fase = "F2"
ejecutor = "haiku"
depende = ["F2.02"]
toca = ["crates/pcode-sandbox/src/lib.rs", "crates/pcode-sandbox/src/apply.rs"]
