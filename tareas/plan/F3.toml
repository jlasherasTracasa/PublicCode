[[tarea]]
id = "F3.07"
nombre = "integracion"
titulo = "Cola de integración: aplicar, commit, rebase, lockfiles regenerados y re-validación"
fase = "F3"
ejecutor = "haiku"
depende = ["F3.05"]
toca = ["crates/pcode-flow/src/lib.rs", "crates/pcode-flow/src/integrate.rs", "crates/pcode-flow/tests/integrate.rs"]
acepta = "cargo test -p pcode-flow integrate"
contexto = ["crates/pcode-flow/src/integrate.rs"]
objetivo = '''
En un worktree de integración (`git worktree add .pcode/integracion main`), de una en una:
1. Aplica los cambios de la tarea (desde su rama o desde la capa de la sandbox) y hace un commit
   `<id>: <título>` con SOLO las rutas de los cambios (nunca `git add -A`).
2. `git rebase main`. Si hay conflicto SOLO en lockfiles (`Cargo.lock`): toma la versión de main,
   regenera (`cargo metadata --offline >/dev/null` o `cargo update -w --offline`) y continúa.
3. Conflicto en `Cargo.toml` raíz de un workspace con `members = ["lib/*"]` o `["crates/*"]`: si las
   dos partes solo añaden miembros, une las listas; si no → `IntegracionFallo` para el coordinador.
4. Cualquier otro conflicto → `git rebase --abort` e `IntegracionFallo`.
5. Re-ejecuta `acepta` sobre el resultado del rebase; solo si pasa, fast-forward de main.
6. Tests con repos git temporales y un workspace Cargo mínimo.
'''
firmas = '''
#[derive(Debug, PartialEq)] pub enum IntegrateResult { Integrated { commit: String }, Conflict { files: Vec<String> }, AcceptFailed(String) }
pub async fn integrate(repo: &std::path::Path, task: &TaskDef, source_branch: &str) -> Result<IntegrateResult, String>;
pub fn merge_member_lists(ours: &str, theirs: &str) -> Option<String>;
'''
tests = ["integra_sin_conflicto", "conflicto_cargo_lock_se_regenera", "conflicto_members_se_une", "conflicto_codigo_aborta", "acepta_falla_tras_rebase_no_avanza_main"]

[[tarea]]
id = "F3.08"
nombre = "clasificador-ci"
titulo = "Clasificador de ejecuciones de GitHub Actions (sin tareas fantasma)"
fase = "F3"
ejecutor = "haiku"
depende = ["F3.01"]
toca = ["crates/pcode-flow/src/lib.rs", "crates/pcode-flow/src/ci.rs", "crates/pcode-flow/tests/fixtures/ci_runs.json"]
acepta = "cargo test -p pcode-flow ci"
contexto = ["docs/arquitectura.md (Flujos)"]
objetivo = '''
`classify(run, jobs)` a partir del JSON de la API de Actions:
1. `success` → `Verde`.
2. `failure` o `timed_out` con al menos un paso fallido → `Roja{jobs, pasos}` (genera una tarea `CI-arreglo-<sha>`).
3. `cancelled`, o `failure` SIN ningún paso fallido → `NoAccionable` (no genera tarea).
4. `startup_failure` o error de infraestructura (runner perdido) → `Infra` (reintentar más tarde).
5. Run en curso → `EnCurso`.
Fixtures con los casos típicos: rojo real, cancelado y «fantasma» (fallo sin ningún paso fallido).
'''
firmas = '''
#[derive(Debug, PartialEq)] pub enum CiVerdict { Green, Red { failing: Vec<(String, String)> }, NotActionable(String), Infra(String), InProgress }
pub fn classify(run: &serde_json::Value, jobs: &serde_json::Value) -> CiVerdict;
'''
tests = ["ci_verde", "ci_roja_con_paso", "ci_cancelada_no_accionable", "ci_failure_sin_pasos_no_accionable", "ci_startup_failure_infra", "ci_en_curso"]

