[[tarea]]
id = "F3.03"
nombre = "eventos-flujo"
titulo = "Estado del flujo por eventos en SQLite y su proyección"
fase = "F3"
ejecutor = "haiku"
depende = ["F3.02", "F1.19"]
toca = ["crates/pcode-flow/Cargo.toml", "crates/pcode-flow/src/lib.rs", "crates/pcode-flow/src/events.rs"]
acepta = "cargo test -p pcode-flow events"
contexto = ["crates/pcode-store/src/lib.rs"]
objetivo = '''
1. `FlowEvent` (serde, etiquetado por `tipo`): `Lanzada{tarea, intento, backend}`,
   `AceptacionOk{tarea, intento}`, `AceptacionFallo{tarea, intento, resumen}`, `Integrada{tarea, commit}`,
   `IntegracionFallo{tarea, motivo}`, `Bloqueada{tarea, motivo}`, `CiRoja{sha, detalle}`, `Parada`.
2. Se guardan como eventos de `pcode-store` con `kind = "flujo"`.
3. `FlowState::replay(events)`: estados por tarea (`Pendiente`, `EnMarcha(intento)`, `Aceptada`,
   `Integrada`, `Bloqueada`) e intentos. Reabrir el proceso = replay: **no hay estado que se pierda**.
'''
firmas = '''
#[derive(Debug, Clone, PartialEq, serde::Serialize, serde::Deserialize)]
#[serde(tag = "tipo")]
pub enum FlowEvent { /* variantes del objetivo */ }
#[derive(Debug, Clone, PartialEq, Eq)] pub enum TaskState { Pending, Running(u32), Accepted, Integrated, Blocked(String) }
#[derive(Debug, Default)] pub struct FlowState { pub tasks: std::collections::BTreeMap<String, TaskState>, pub attempts: std::collections::BTreeMap<String, u32> }
impl FlowState { pub fn replay(events: &[FlowEvent]) -> FlowState; }
'''
tests = ["replay_ciclo_completo", "replay_reintentos", "persistir_y_releer (Store en memoria)"]

[[tarea]]
id = "F3.04"
nombre = "planificador-ejecucion"
titulo = "Planificador de ejecución: paralelismo por modo y exclusión de kernel"
fase = "F3"
ejecutor = "haiku"
depende = ["F3.03"]
toca = ["crates/pcode-flow/src/lib.rs", "crates/pcode-flow/src/scheduler.rs"]
acepta = "cargo test -p pcode-flow scheduler"
contexto = ["crates/pcode-flow/src/dag.rs"]
objetivo = '''
Función PURA `plan(dag, state, limits, flags)` → lista de tareas a lanzar ahora:
1. Como mucho `limits.max_parallel` en marcha en total.
2. `Kernel`: como mucho 1 a la vez, y ninguna si `flags.kernel_busy` (el coordinador está editando el árbol principal).
3. Una tarea `CI-arreglo-*` lista va antes que cualquier otra de kernel.
4. `Coordinator`: nunca se lanza sola; aparece en `needs_coordinator`.
5. Tras `max_attempts` fallos → `Bloqueada`.
'''
firmas = '''
pub struct Limits { pub max_parallel: usize, pub max_attempts: u32 }
pub struct Flags { pub kernel_busy: bool, pub stop: bool, pub provider_down: bool }
pub struct Plan { pub launch: Vec<String>, pub needs_coordinator: Vec<String>, pub newly_blocked: Vec<String> }
pub fn plan(dag: &Dag, state: &FlowState, limits: &Limits, flags: &Flags) -> Plan;
'''
tests = ["plan_respeta_max_parallel", "plan_un_kernel_a_la_vez", "plan_kernel_ocupado", "plan_ci_arreglo_primero", "plan_coordinador_no_se_lanza", "plan_bloquea_tras_max_intentos", "plan_stop_no_lanza"]

[[tarea]]
