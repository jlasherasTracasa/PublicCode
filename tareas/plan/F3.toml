[[tarea]]
id = "F3.01"
nombre = "tareas-parser"
titulo = "`pcode-flow`: leer tareas (frontmatter y cabeceras HTML)"
fase = "F3"
ejecutor = "haiku"
depende = ["F0.01"]
toca = ["crates/pcode-flow/Cargo.toml", "crates/pcode-flow/src/lib.rs", "crates/pcode-flow/src/task.rs"]
acepta = "cargo test -p pcode-flow task"
contexto = ["tareas/F1.01-config.md (formato de tarea)"]
objetivo = '''
1. Acepta las cabeceras `<!-- acepta: … -->`, `<!-- modo: … -->` y `<!-- depende: a, b -->` (como
   `<!-- clave: valor -->`) y, además, un frontmatter `---` con `acepta`, `modo`, `depende`, `toca`,
   `backend`, `skills`, `presupuesto_minutos`.
2. Si están los dos, manda el frontmatter.
3. `id` = nombre del archivo sin `.md`. `body` = el resto.
4. `load_dir(dir)` carga todos los `.md` (ignora los que no tienen `acepta` y lo avisa con `tracing::warn!`).
'''
firmas = '''
#[derive(Debug, Clone, PartialEq, Eq, serde::Serialize)] pub enum Mode { Kernel, Isolated, Coordinator }
#[derive(Debug, Clone, PartialEq, serde::Serialize)]
pub struct TaskDef { pub id: String, pub accept: String, pub mode: Mode, pub depends: Vec<String>, pub touches: Vec<String>,
                     pub backend: Option<String>, pub skills: Vec<String>, pub budget_minutes: Option<u32>, pub body: String }
pub fn parse_task(id: &str, text: &str) -> Result<TaskDef, String>;
pub fn load_dir(dir: &std::path::Path) -> Result<Vec<TaskDef>, String>;
'''
tests = ["parsea_cabecera_html", "parsea_frontmatter", "frontmatter_gana", "modo_por_defecto_kernel", "sin_acepta_se_ignora_en_load_dir"]

