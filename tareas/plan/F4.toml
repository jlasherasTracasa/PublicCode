[[tarea]]
id = "F4.05"
nombre = "busqueda-hibrida"
titulo = "Búsqueda híbrida (BM25 + símbolos, RRF), compresión de código y subagente bibliotecario"
fase = "F4"
ejecutor = "haiku"
depende = ["F4.04", "F4.03"]
