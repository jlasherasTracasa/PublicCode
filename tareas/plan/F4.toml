contexto = ["docs/backends.md (asignación de roles)", "crates/pcode-flow/src/bench.rs", "docs/papers.md (Steer Don't Solve, Collaboration Tax)"]
objetivo = '''
1. Rasgos de la tarea: modo, crate o directorio principal de `toca` y etiquetas del frontmatter.
2. Por backend y rasgo: tasa de éxito a la primera con suavizado de Laplace y coste medio (tokens),
   a partir de los `BenchRow`.
3. `choose(task, candidates, weights)`: maximiza `éxito − λ·coste_normalizado`; con menos de 3
   muestras usa el backend por defecto del rol.
4. Crítico: si `critic = true` en la tarea o el router lo recomienda (tasa < 0,5), el plan del
   implementador pasa por un modelo barato antes de ejecutar.
5. Regla de colaboración: no crear subagentes si la tarea toca ≤ 2 archivos.
'''
firmas = '''
pub struct RouterStats { /* (backend, rasgo) → (éxitos, intentos, tokens) */ }
impl RouterStats { pub fn from_rows(rows: &[(String, TaskDef, BenchRow)]) -> Self; }
pub fn choose(stats: &RouterStats, task: &TaskDef, candidates: &[String], lambda: f32, default: &str) -> String;
pub fn needs_critic(stats: &RouterStats, task: &TaskDef, backend: &str) -> bool;
pub fn allow_subagents(task: &TaskDef) -> bool;
'''
