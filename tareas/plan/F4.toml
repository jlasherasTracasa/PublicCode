[[tarea]]
id = "F4.03b"
nombre = "memoria-facetas-store"
titulo = "`FacetStore`: facetas de un archivo en SQLite, válidas solo si el hash coincide"
fase = "F4"
hito = "1.7"
talla = "M"
ejecutor = "haiku"
depende = ["F4.03a"]
