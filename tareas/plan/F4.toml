[[tarea]]
id = "F4.01"
nombre = "contexto-tool"
titulo = "Tool `contexto` (fijar, soltar, resumir) y estado del proyecto que sobrevive a la compactación"
fase = "F4"
ejecutor = "haiku"
depende = ["F1.21"]
toca = ["crates/pcode-core/src/lib.rs", "crates/pcode-core/src/context.rs", "crates/pcode-core/src/agent.rs"]
acepta = "cargo test -p pcode-core context"
contexto = ["docs/papers.md (sección 1: Context as a Tool, Memory as Action, SLUMP)", "crates/pcode-core/src/agent.rs"]
objetivo = '''
1. La tool `contexto` la intercepta el bucle (no está en `pcode-tools`): `{"op": "fijar"|"soltar"|"nota"|"estado", "ids": [int]?, "texto": str?}`.
   - Cada resultado de tool lleva un id corto visible (`[r12]`).
   - `soltar`: sustituye los resultados indicados por `"[r12 soltado: <primera línea>]"`.
   - `fijar`: marca resultados que la compactación no puede tocar.
   - `nota`: añade una decisión o restricción al **estado del proyecto** (`.pcode/estado-proyecto.md`).
   - `estado`: devuelve el estado del proyecto.
2. El estado del proyecto se reinyecta como mensaje de sistema adicional tras cada compactación (F4.02).
'''
firmas = '''
pub struct ContextLedger { /* ids → índice de mensaje, fijados */ }
impl ContextLedger {
    pub fn new() -> Self;
    pub fn register_result(&mut self, msg_index: usize) -> u32;
    pub fn drop_results(&mut self, ids: &[u32], messages: &mut [pcode_models::Message]) -> usize;
    pub fn pin(&mut self, ids: &[u32]);
    pub fn is_pinned(&self, msg_index: usize) -> bool;
}
pub fn append_project_note(root: &std::path::Path, note: &str) -> std::io::Result<()>;
pub fn read_project_state(root: &std::path::Path) -> std::io::Result<String>;
'''
tests = ["soltar_sustituye_por_marcador", "fijado_se_respeta", "nota_persiste_en_archivo", "agente_usa_contexto_con_mock"]
papers = ["Context as a Tool (Findings ACL 2026)", "Memory as Action (Findings ACL 2026)", "When the Specification Emerges / SLUMP (Findings EMNLP 2026)"]

[[tarea]]
id = "F4.02"
nombre = "compactacion-prefijo"
titulo = "Compactación por segmentos con prefijo estable (no rompe la caché)"
fase = "F4"
ejecutor = "haiku"
depende = ["F4.01"]
toca = ["crates/pcode-core/src/lib.rs", "crates/pcode-core/src/compact.rs", "crates/pcode-core/src/agent.rs"]
acepta = "cargo test -p pcode-core compact"
contexto = ["docs/papers.md (TokenPilot, SWE-MEM, survey de compresión)", "crates/pcode-core/src/context.rs"]
objetivo = '''
1. Prefijo estable = mensajes de sistema + índice de skills + definición de tools: **nunca** se modifica.
2. Historial en segmentos (un segmento = un turno del asistente y sus resultados). Cuando el uso
   estimado (4 caracteres por token) supera `umbral` × contexto, los segmentos más antiguos NO fijados
   se sustituyen por UN mensaje resumen en la frontera, generado con el rol `compactador` (un
   `Provider`). Los N segmentos más recientes se conservan siempre.
3. Tras compactar: el estado del proyecto (F4.01) va justo después del resumen.
4. El resumen debe conservar rutas de archivos, errores abiertos y restricciones: el prompt del
   compactador lo exige y un test comprueba que las rutas mencionadas siguen estando.
'''
firmas = '''
pub struct CompactCfg { pub context_tokens: u64, pub threshold: f32, pub keep_recent_segments: usize }
pub fn estimate_tokens(messages: &[pcode_models::Message]) -> u64;
pub fn segments(messages: &[pcode_models::Message], prefix_len: usize) -> Vec<std::ops::Range<usize>>;
pub async fn compact(messages: &mut Vec<pcode_models::Message>, prefix_len: usize, ledger: &crate::context::ContextLedger,
                     cfg: &CompactCfg, summarizer: &dyn pcode_models::Provider, model: &str) -> Result<bool, pcode_models::ModelError>;
'''
tests = ["prefijo_intacto_byte_a_byte", "respeta_fijados", "conserva_recientes", "resumen_conserva_rutas (mock compactador)", "no_compacta_bajo_umbral"]
papers = ["TokenPilot (Findings EMNLP 2026)", "SWE-MEM (EMNLP 2026)", "Context Compression for LLM Agents: A Survey (EMNLP 2026)"]

