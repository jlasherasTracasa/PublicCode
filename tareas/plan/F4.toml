  "crates/pcode-core/src/script.rs (`SCRIPT_TOOL`, `script_spec`, `parse_steps`, `run_script`, `render`, `StepResult`)",
  "crates/pcode-cli/src/chat.rs (función `prepare`: la cadena de `.with_…()` tras `Agent::new`)",
