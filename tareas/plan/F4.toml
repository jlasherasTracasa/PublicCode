[[tarea]]
id = "F4.05d"
nombre = "comprimir-codigo"
titulo = "`compress_code`: conservar firmas y cuerpos relevantes, omitir el resto (lógica pura)"
fase = "F4"
hito = "1.7"
talla = "M"
ejecutor = "haiku"
depende = ["F4.05a", "F4.05b"]
toca = ["crates/pcode-memory/src/compress_code.rs", "crates/pcode-memory/src/lib.rs"]
