[[tarea]]
id = "F4.07"
nombre = "router-historico"
titulo = "Router por histórico del banco y rol crítico opcional"
fase = "F4"
ejecutor = "haiku"
depende = ["F3.13"]
toca = ["crates/pcode-flow/src/lib.rs", "crates/pcode-flow/src/router.rs"]
