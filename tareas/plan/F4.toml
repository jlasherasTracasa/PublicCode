  "plan_segmentos_no_separan_llamada_y_resultados: los roles del ejemplo dan esos cinco rangos",
  "plan_resume_los_antiguos: el primer plan del ejemplo",
  "plan_respeta_segmentos_fijados: con un historial de 6 segmentos y el resultado del segundo fijado, summarize no contiene ningún índice de ese segmento",
  "plan_nada_si_hay_pocos_segmentos: con 3 segmentos o menos y keep_recent 3 devuelve None",
]
