pub struct Client { /* transporte */ }
impl Client {
    pub async fn connect(repo: &std::path::Path) -> anyhow::Result<Client>;
    pub async fn connect_or_spawn(repo: &std::path::Path, pcode_bin: &std::path::Path) -> anyhow::Result<Client>;
