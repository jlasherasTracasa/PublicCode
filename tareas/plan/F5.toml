[[tarea]]
id = "F5.26b"
nombre = "github-pr-de-tarea"
titulo = "Flujos: PR de una tarea con informe, salida de `acepta`, check y comentario de revisión"
fase = "F5"
hito = "1.8"
talla = "M"
ejecutor = "haiku"
depende = ["F5.26a", "F4.07"]
toca = ["crates/pcode-flow/src/github.rs", "crates/pcode-flow/src/lib.rs"]
acepta = "cargo test -p pcode-flow github::"
contexto = [
  "crates/pcode-backends/src/github_api.rs (trait `GitHubApi` con `create_pr`, `create_check_run` y `comment`; `FakeGitHub` y `FakeState` para los tests)",
  "crates/pcode-flow/src/ci.rs (módulo vecino sobre GitHub: estilo y tests)",
]
objetivo = '''
1. Crea `github.rs` con `PrRequest`, `pr_body`, `check_conclusion` y `publish_task_pr` (firmas abajo).
2. `pr_body(req)`: Markdown con, en este orden: `## Tarea` y el título; `## Informe` y `req.report` (o
   `_sin informe_` si está vacío); `## Aceptación` con la orden en una línea entre comillas invertidas, el
   resultado (`✓ pasa` / `✗ falla`) y las últimas 30 líneas de `req.accept_output` en un bloque de código; y la
   línea final `_PR abierto por PublicCode. No se fusiona automáticamente: revísalo y fusiónalo tú._`.
3. `check_conclusion(ok)`: `"success"` o `"failure"`.
4. `publish_task_pr(api, req)`: `api.create_pr(&req.head, &req.base, &format!("{}: {}", req.task_id,
   req.title), &pr_body(req))`; después `api.create_check_run("pcode acepta", &req.head_sha,
   check_conclusion(req.accept_ok), <primera línea no vacía de accept_output, o «sin salida»>)`; y, si
   `req.review` es `Some(texto)`, `api.comment(pr, &format!("## Revisión cruzada\n\n{texto}"))`. Devuelve el
   número del PR. Los errores de la API se devuelven como texto (`e.to_string()`). Nunca fusiona.
5. `lib.rs`: añade `pub mod github;`.
'''
firmas = '''
// crates/pcode-flow/src/github.rs
use pcode_backends::GitHubApi;

/// Datos del PR de una tarea.
#[derive(Debug, Clone, Default, PartialEq)]
pub struct PrRequest {
    pub task_id: String,
    pub title: String,
    /// Rama con el trabajo (`pcode/<id>`).
    pub head: String,
    /// Rama de destino.
    pub base: String,
    /// Commit de la rama.
    pub head_sha: String,
    /// Informe de la tarea (Markdown).
    pub report: String,
    pub accept_cmd: String,
    pub accept_ok: bool,
    pub accept_output: String,
    /// Texto de la revisión cruzada, si la hubo.
    pub review: Option<String>,
}

pub fn pr_body(req: &PrRequest) -> String;
pub fn check_conclusion(ok: bool) -> &'static str;
/// Abre el PR, publica el check y comenta la revisión. Devuelve el número del PR.
pub async fn publish_task_pr(api: &dyn GitHubApi, req: &PrRequest) -> Result<u64, String>;
'''
ejemplo = '''
req = PrRequest { task_id: "T1", title: "Saludo", head: "pcode/T1", base: "main", head_sha: "abc123",
                  report: "# T1\n## Hecho\n- saluda", accept_cmd: "cargo test", accept_ok: true,
                  accept_output: "test result: ok. 3 passed", review: Some("sin problemas") }
publish_task_pr(&FakeGitHub::default(), &req) → Ok(201)
  state.prs[0] = ("pcode/T1", "main", "T1: Saludo", cuerpo con "## Informe", "`cargo test`" y "✓ pasa")
  state.checks[0] = ("pcode acepta", "abc123", "success", "test result: ok. 3 passed")
  state.comments[0] = (201, "## Revisión cruzada\n\nsin problemas")
'''
tests = [
  "pr_lleva_informe_y_acepta: el cuerpo contiene el informe, la orden y `✓ pasa`",
  "pr_recorta_la_salida_larga: con 100 líneas de salida, el cuerpo contiene la última y no la primera",
  "check_run_refleja_resultado: con accept_ok false el check guardado tiene conclusión failure",
  "comenta_la_revision_si_la_hay: con review Some hay un comentario en el PR 201 y con None ninguno",
  "error_de_la_api_se_devuelve: con fail en la API falsa, publish_task_pr devuelve Err con ese texto",
  "no_fusiona: el cuerpo avisa de que no se fusiona automáticamente",
]
no_hagas = ["No lances `git` ni `gh` aquí", "No hagas peticiones de red: los tests usan `FakeGitHub`", "No añadas dependencias a `pcode-flow`"]

[[tarea]]
id = "F5.26c"
nombre = "github-rama-de-tarea"
titulo = "Flujos: integrar una tarea en su propia rama y subirla (sin forzar)"
fase = "F5"
hito = "1.8"
talla = "M"
ejecutor = "haiku"
depende = ["F5.26b"]
toca = ["crates/pcode-flow/src/integrate.rs"]
acepta = "cargo test -p pcode-flow rama_de_tarea"
contexto = [
  "crates/pcode-flow/src/integrate.rs (función privada `git`, función `integrate` y los auxiliares `repo_with` y `sb` de sus tests)",
]
objetivo = '''
1. En `integrate.rs`, añade las tres funciones de abajo. Todas usan la función privada `git(repo, args)`.
2. `task_branch(id)`: `pcode/<id>` cambiando por `-` cualquier carácter que no sea letra ASCII, cifra, `.`, `_`
   o `-`.
3. `integrate_on_branch(sb, repo, id, title)`: anota la rama actual (`git rev-parse --abbrev-ref HEAD`); crea
   y cambia a la rama de la tarea (`git switch -c <rama>`; si ya existe, devuelve
   `Err("la rama <rama> ya existe")` sin tocar nada); llama a `integrate(sb, repo, id, title)`; y vuelve
   SIEMPRE a la rama original (`git switch <original>`), también si `integrate` falla. Devuelve
   `(resultado de integrate, nombre de la rama)`.
4. `push_branch(repo, remote, branch)`: `git push <remote> <branch>` (sin `--force`). Devuelve el sha de la
   rama (`git rev-parse <branch>`). Si el push falla, `Err` con el mensaje de git.
5. Tests en el módulo `tests` de `integrate.rs`, con nombres que empiezan por `rama_de_tarea_`.
'''
firmas = '''
// crates/pcode-flow/src/integrate.rs
/// Nombre de la rama de una tarea: `pcode/<id saneado>`.
pub fn task_branch(id: &str) -> String;
/// Como `integrate`, pero el commit queda en la rama de la tarea y el repo vuelve a la rama en que estaba.
pub fn integrate_on_branch(sb: Sandbox, repo: &Path, id: &str, title: &str) -> Result<(Integrated, String), String>;
/// Sube la rama al remoto (nunca forzado) y devuelve su commit.
pub fn push_branch(repo: &Path, remote: &str, branch: &str) -> Result<String, String>;
'''
ejemplo = '''
task_branch("F1.02-tipos") → "pcode/F1.02-tipos"      task_branch("a b/c") → "pcode/a-b-c"
Repo temporal en `main` con un remoto `origin` que es otro directorio creado con `git init --bare`:
  git branch pcode/T1 && push_branch(repo, "origin", "pcode/T1") → Ok(sha); `git -C <bare> rev-parse pcode/T1` da el mismo sha
  push_branch(repo, "origin", "no-existe") → Err(..)
integrate_on_branch (con sandbox que crea a.txt) → la rama `pcode/T1` tiene el commit `T1: título`, `main` no
  tiene a.txt en su último commit y `git rev-parse --abbrev-ref HEAD` sigue siendo `main`
'''
tests = [
  "rama_de_tarea_nombre_saneado: los dos casos de task_branch del ejemplo",
  "rama_de_tarea_se_sube_al_remoto: con un remoto bare local, push_branch devuelve el sha y el remoto tiene la rama (no necesita sandbox)",
  "rama_de_tarea_inexistente_falla: subir una rama que no existe devuelve Err",
  "rama_de_tarea_integra_sin_mover_main: el último caso del ejemplo (se salta sin namespaces de usuario, como los demás tests de integrate)",
]
no_hagas = ["No uses `--force` ni `-f` en ningún `git push`", "No cambies la función `integrate` ni sus tests", "No borres ramas"]

