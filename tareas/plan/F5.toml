import type { Event } from "./protocol/Event";

export interface Transport {
  call<R>(method: string, params: unknown): Promise<R>;
  subscribe(onEvent: (e: Event) => void): () => void;
}
export function createHttpTransport(baseUrl: string, token: string): Transport;
export function createMockTransport(handlers: Record<string, (params: unknown) => unknown>): Transport & { emit(e: Event): void };
export const TransportContext: React.Context<Transport | null>;
export function useTransport(): Transport;
'''
