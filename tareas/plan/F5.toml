ejecutor = "coordinador"
depende = ["F5.02", "F0.07"]
toca = ["apps/android/", "crates/pcode-cli/src/main.rs", ".github/workflows/ci.yml", ".github/workflows/release.yml", "docs/adr/ADR-0006-apk-android.md"]
acepta = "gradle -p apps/android -q testDebugUnitTest assembleRelease && test -s apps/android/app/build/outputs/apk/release/app-release.apk && cargo build -q -p pcode-cli && ./target/debug/pcode daemon --help | grep -q -- --escuchar"
contexto = ["docs/adr/ADR-0006-apk-android.md", "docs/interfaces.md (sección «Móvil»)", "crates/pcode-server/src/server.rs (index y cookie)"]
objetivo = '''
1. `pcode daemon --escuchar <IP>` (por defecto `127.0.0.1`) con aviso si no es loopback; token fijo
   opcional con `PCODE_DAEMON_TOKEN` (32 caracteres o más).
2. `apps/android` (Java, sin AndroidX): `Conexion` (lógica pura: interpretar la URL con `?t=`, origen,
   mismo origen) y `MainActivity` (formulario de emparejamiento, WebView limitado al origen, menú
   recargar/cambiar servidor, 401 ⇒ volver a emparejar). Textos en `values` y `values-en`.
3. CI: job `android` (tests JUnit, lint y APK). Release: `pcode-<versión>-android.apk` en
   `SHA256SUMS`, firmado con los secretos `PCODE_ANDROID_*` o con la clave de depuración.
'''
tests = ["ConexionTest: parseUrlDelDemonio, parseHttpsSinPuertoYConOtrosParametros, parseIpv6, rechazaUrlsInvalidas, mismoOrigen"]

[[tarea]]
id = "F5.29"
nombre = "chat"
titulo = "`pcode chat`: conversación interactiva con el agente (sustituto de Claude Code y opencode)"
fase = "F5"
ejecutor = "coordinador"
depende = ["F1.16", "F1.22", "F1.23", "F5.28"]
toca = ["crates/pcode-core/src/agent.rs", "crates/pcode-cli/src/chat.rs", "crates/pcode-cli/src/provider.rs", "crates/pcode-cli/src/run.rs", "crates/pcode-cli/src/main.rs", "crates/pcode-cli/tests/chat.rs"]
acepta = "cargo test -p pcode-core && cargo test -p pcode-cli"
contexto = ["crates/pcode-core/src/agent.rs", "crates/pcode-cli/src/run.rs", "README.md (sección «Uso rápido»)"]
objetivo = '''
1. `Agent::run_turn(history, user)` continúa una conversación (presupuesto por vuelta; el prompt de
   sistema no se duplica) y `with_observer` entrega `AgentEvent` (texto, llamada y resultado de tool).
2. `pcode chat` (y `pcode` sin argumentos en una terminal): bucle de lectura con `/modelo`, `/nuevo`,
   `/uso`, `/ayuda`, `/salir`, líneas con `\\`, Ctrl-C que interrumpe solo al agente, aprobaciones por
   terminal (`s`, `t`, `N`) o `--aprobar-todo`, `--continuar` desde SQLite y colores solo en una TTY sin
   `NO_COLOR`. Sin TTY lee un mensaje por línea.
3. Proveedor elegido por `--proveedor`, el primero de `pcode.toml` o la clave del entorno
   (`ANTHROPIC_API_KEY`, `GEMINI_API_KEY`/`GOOGLE_API_KEY`, `OPENAI_API_KEY`); el prompt de sistema
   incluye `AGENTS.md` y `CLAUDE.md`.
'''
tests = ["run_turn_conserva_el_historial_entre_vueltas", "observador_recibe_texto_y_tools", "chat_dos_mensajes_por_stdin_con_tool_y_comandos", "chat_continuar_retoma_la_conversacion", "chat_sin_modelo_configurado_explica_que_hacer", "chat_deniega_en_no_interactivo_lo_que_pide_confirmacion"]

[[tarea]]
id = "F5.30"
nombre = "tui-local"
titulo = "TUI a pantalla completa con el agente en proceso (`pcode`, `pcode tui`)"
fase = "F5"
ejecutor = "coordinador"
depende = ["F5.29", "F1.25"]
toca = ["crates/pcode-tui/", "crates/pcode-cli/src/chat.rs", "crates/pcode-cli/src/main.rs", "docs/adr/ADR-0007-tui-local.md"]
acepta = "cargo test -p pcode-tui && cargo test -p pcode-cli"
contexto = ["AGENTS.md (§6.3, TUI)", "tareas/F5.07-tui-estado.md", "tareas/F5.08-tui-chat.md"]
objetivo = '''
Base de F5.07, F5.08 y F5.11 sin esperar al demonio (F5.05): mismo diseño, con el agente en el proceso.
1. `App` con todo el estado; `update(Event) -> Vec<Command>` puro; `render(&App, &mut Frame)` sin efectos.
2. Transcripción con streaming, Markdown mínimo, tools con estado (`◐ ✓ ✗`) y salida plegable (Ctrl+O),
   desplazamiento (PgUp/PgDn), entrada multilínea (Alt+Intro, `\\`, pegar), historial (↑/↓), Esc o Ctrl+C
   interrumpen, aprobaciones en ventana (`s`, `t`, `n`), `/modelo`, `/nuevo`, `/uso`, `/ayuda`, `/salir`.
3. Temas `oscuro`, `claro` y `alto-contraste` (`PCODE_TEMA`), `NO_COLOR` y textos en `es`/`en`.
4. `run_tui`: modo raw y pantalla alternativa restaurados también con pánico (`ratatui::init`),
   teclado en un hilo con `poll` acotado, agente en una tarea que se aborta al interrumpir.
'''
tests = ["render_80x24_transcripcion_entrada_y_estado", "render_120x40_despliega_salidas_y_muestra_aprobacion", "render_sigue_el_final_y_scroll_sube", "chat_streaming_une_trozos_y_tools_cambian_de_estado", "chat_aprobacion_bloquea_el_teclado_hasta_responder", "chat_esc_y_ctrl_c_cancelan_o_salen", "theme_no_color_quita_colores_pero_no_negrita", "i18n_las_dos_tablas_tienen_las_mismas_claves"]

