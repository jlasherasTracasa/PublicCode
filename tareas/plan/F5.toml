[[tarea]]
id = "F5.14c"
nombre = "diff-js"
titulo = "Studio: módulo `diff.js` (parsear un diff unificado y emparejarlo lado a lado, puro)"
fase = "F5"
hito = "1.6"
talla = "M"
ejecutor = "haiku"
