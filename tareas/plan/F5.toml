[[tarea]]
id = "F5.04b"
nombre = "api-flujo-estado"
titulo = "Demonio: leer el estado del flujo del proyecto (`flow_api.rs`, lógica)"
fase = "F5"
hito = "1.4"
talla = "M"
ejecutor = "haiku"
depende = ["F5.04a", "F3.10"]
toca = ["crates/pcode-server/src/flow_api.rs", "crates/pcode-server/src/lib.rs"]
toca_extra = ["crates/pcode-server/Cargo.toml"]
acepta = "cargo test -p pcode-server flow_api::"
contexto = [
  "crates/pcode-flow/src/events.rs (`load(&store, session)`, `FlowState::replay`, `FlowState::state`, `TaskState`)",
  "crates/pcode-cli/src/flow_cmd.rs (funciones `session` y `runner`: el flujo guarda sus eventos en `.pcode/flow.db`, sesión cuyo `task` es `flujo`; las tareas están en `tareas/`)",
  "crates/pcode-protocol/src/lib.rs (`TaskDto` y `FlowStatusResult`)",
]
objetivo = '''
1. `Cargo.toml` de `pcode-server`: añade las dependencias `pcode-flow = { path = "../pcode-flow" }` y
   `pcode-store = { path = "../pcode-store" }`.
2. Crea `flow_api.rs` con las cuatro funciones de abajo. `lib.rs`: añade `pub mod flow_api;`.
3. `task_dtos`: un `TaskDto` por tarea, en el orden de `tasks`. `state`: `done` si el id está en `done`; si no,
   según `state.state(id)`: `Pending` → `pending`, `Running(_)` → `running`, `Accepted` → `accepted`,
   `Integrated` → `integrated`, `Blocked(_)` → `blocked`. `attempts` de `state.attempts` (0 si no consta).
4. `flow_status(repo, running)`: tareas = `pcode_flow::task::load_dir(&repo.join("tareas"))` (si la carpeta no
   existe, lista vacía, sin error); eventos = vacíos si no existe `repo/.pcode/flow.db`; si existe,
   `pcode_store::Store::open`, la sesión cuyo `task == "flujo"` (de `store.sessions(50)`) y
   `pcode_flow::events::load`; `done` = ids con `repo/informes/<id>.md`. `needs_coordinator` = ids de las tareas
   `Mode::Coordinator` cuyo estado no es `done` ni `integrated`. Los errores se devuelven como texto.
5. `changed(prev, now)`: los `TaskDto` de `now` que no están iguales en `prev` (por id; los nuevos también).
6. `request_stop(repo)`: crea `repo/.pcode/` si falta y escribe el archivo vacío `repo/.pcode/STOP`.
'''
firmas = '''
// crates/pcode-server/src/flow_api.rs
use pcode_flow::{FlowState, TaskDef};
use pcode_protocol::{FlowStatusResult, TaskDto};
use std::collections::HashSet;
use std::path::Path;

/// Tareas con su estado, listas para la API.
pub fn task_dtos(tasks: &[TaskDef], state: &FlowState, done: &HashSet<String>) -> Vec<TaskDto>;
/// Estado del flujo del proyecto `repo` (lee `tareas/`, `informes/` y `.pcode/flow.db`).
pub fn flow_status(repo: &Path, running: bool) -> Result<FlowStatusResult, String>;
/// Tareas cuyo estado o intentos cambiaron entre dos lecturas.
pub fn changed(prev: &[TaskDto], now: &[TaskDto]) -> Vec<TaskDto>;
/// Pide parar el flujo (archivo `.pcode/STOP`).
pub fn request_stop(repo: &Path) -> Result<(), String>;
'''
ejemplo = '''
repo temporal con tareas/a.md ("<!-- acepta: true -->\n# a\n"), tareas/b.md (igual, con "<!-- modo: coordinador -->")
e informes/a.md:
  flow_status(repo, false) → tasks [a: done, b: pending], needs_coordinator ["b"], running false
changed([a: pending 0], [a: running 1, b: pending 0]) → [a: running 1, b: pending 0]
changed(x, x) → []
request_stop(repo) → existe repo/.pcode/STOP
'''
tests = [
  "estado_sin_base_de_datos: el repo del ejemplo da a hecha, b pendiente y b en needs_coordinator",
  "estado_sin_carpeta_de_tareas: un repo vacío da tasks vacío sin error",
  "estado_lee_los_eventos: tras guardar un Lanzada de a en .pcode/flow.db (Store::open, create_session(\"flujo\", \"flujo\"), pcode_flow::events::persist), a sale running con 1 intento",
  "dto_por_estado: task_dtos traduce Integrated a `integrated` y Blocked a `blocked`",
  "cambios_entre_lecturas: los dos casos de changed del ejemplo",
  "parar_crea_el_archivo: request_stop crea .pcode/STOP",
]
no_hagas = ["No toques `server.rs` en esta tarea", "No ejecutes el flujo dentro del demonio: aquí solo se lee su estado", "No crees `.pcode/flow.db` si no existe"]

[[tarea]]
id = "F5.04c"
nombre = "api-flujo-servidor"
titulo = "Demonio: métodos `flow.status`, `flow.run` y `flow.stop` y evento `TaskUpdated`"
fase = "F5"
hito = "1.4"
talla = "M"
ejecutor = "haiku"
depende = ["F5.04b"]
toca = ["crates/pcode-server/src/server.rs"]
acepta = "cargo test -p pcode-server flujo_rpc"
contexto = [
  "crates/pcode-server/src/server.rs (función `rpc`: el `match req.method.as_str()`; rama `methods::SPEC_RUN`: cómo se lanza `pcode` con `create_command_session`; rama `methods::WORKSPACE_TASKS`: uso de `blocking` y `ws_reply`; `AppState::state_of` y `AppState::emit`)",
  "crates/pcode-server/src/flow_api.rs (`flow_status`, `changed`, `request_stop`)",
  "crates/pcode-server/src/server.rs (módulo `tests`: auxiliar `call` y el test `sesion_con_proceso_emite_eventos_y_termina`, que usa otro binario en lugar de `pcode`)",
]
objetivo = '''
El flujo no corre dentro del demonio: el demonio lanza `pcode flow run` como una sesión más (igual que
`spec.run`) y vigila `.pcode/flow.db` para emitir `Event::TaskUpdated`.
1. En `server.rs`, añade a `AppState` el método `flow_running` (firma abajo): true si alguna sesión de
   `self.sessions` tiene `backend == "flow"` y `state == SessionState::Running`.
2. Añade `AppState::watch_flow` (firma abajo): `tokio::spawn` de un bucle con
   `tokio::time::interval(Duration::from_secs(1))` y como mucho 86 400 vueltas. En cada vuelta: lee
   `crate::flow_api::flow_status(&repo, true)` con `blocking`; por cada tarea de
   `crate::flow_api::changed(&prev, &now.tasks)` emite `Event::TaskUpdated { task }`; guarda `now.tasks` como
   `prev`; y, DESPUÉS de emitir, si `self.state_of(session) != Some(SessionState::Running)`, termina. `prev`
   empieza vacío: la primera vuelta (inmediata) emite todas las tareas.
3. En el `match` de `rpc`, junto a `methods::WORKSPACE_TASKS`:
   - `methods::FLOW_STATUS`: `ws_reply(id, blocking(move || crate::flow_api::flow_status(&root, running)).await)`
     con `running = st.flow_running()`.
   - `methods::FLOW_RUN`: parámetros `{backend: string, paralelo?: number}`. Sin `backend` →
     `rpc_err(id, -32602, "se esperaba {backend}")`. Si `st.flow_running()` → `rpc_err(id, -32000, "ya hay un
     flujo en marcha")`. Si no: `create_command_session("Flujo de tareas".into(), "flow", args)` con
     `args = ["flow", "run", "--backend", <backend>]` (más `"--paralelo", <n>` si viene), `st.watch_flow(info.id)`
     y responde con el `SessionInfo`.
   - `methods::FLOW_STOP`: `ws_reply(id, crate::flow_api::request_stop(&st.repo).map(|_| true))`.
4. Añade al módulo `tests` los tests de la lista. Usa un `AppState::new(<tempdir>, <binario>, None)` propio (no
   el auxiliar `app`, que usa el directorio temporal del sistema como proyecto).
'''
firmas = '''
// crates/pcode-server/src/server.rs
impl AppState {
    /// ¿Hay un flujo lanzado desde el demonio que sigue en marcha?
    fn flow_running(&self) -> bool;
    /// Vigila el estado del flujo mientras dure la sesión `session` y emite `TaskUpdated` con cada cambio.
    fn watch_flow(self: &Arc<Self>, session: i64);
}
'''
ejemplo = '''
proyecto temporal con tareas/a.md = "<!-- acepta: true -->\n# a\n"
flow.status {}                    → result.tasks = [{"id":"a","state":"pending","attempts":0}], result.running = false
flow.run {"backend":"modelo"}     (binario /bin/true) → result.backend = "flow"; llega un evento {"tipo":"taskUpdated","task":{"id":"a",…}}
flow.run {}                       → error.code = -32602
flow.stop {}                      → result = true y existe .pcode/STOP
'''
tests = [
  "flujo_rpc_status_lista_tareas: flow.status sobre el proyecto del ejemplo devuelve la tarea a en pending",
  "flujo_rpc_run_lanza_sesion_y_emite_task_updated: con /bin/true como binario, flow.run devuelve una sesión con backend flow y por `st.events.subscribe()` llega un TaskUpdated de a antes de 5 s (tokio::time::timeout)",
  "flujo_rpc_run_sin_backend: flow.run sin parámetros da el error -32602",
  "flujo_rpc_stop_crea_el_archivo: flow.stop devuelve true y crea .pcode/STOP",
]
no_hagas = [
  "No añadas `pcode-flow` al bucle del demonio ni construyas un `Runner` aquí",
  "No pongas un bucle sin cota ni una espera sin tiempo máximo",
  "No cambies la firma de `create_command_session` ni el resto de métodos",
]

