    /// Publica un check terminado sobre el commit `head_sha` (`conclusion`: success, failure o neutral).
    async fn create_check_run(&self, name: &str, head_sha: &str, conclusion: &str, summary: &str) -> Result<(), BackendError>;
'''
ejemplo = '''
