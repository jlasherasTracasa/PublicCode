[[tarea]]
id = "F6.05"
nombre = "trayectorias"
titulo = "Puntuación estructural de trayectorias y exportación de trazas"
fase = "F6"
ejecutor = "haiku"
depende = ["F3.03"]
toca = ["crates/pcode-flow/src/lib.rs", "crates/pcode-flow/src/trajectory.rs"]
acepta = "cargo test -p pcode-flow trajectory"
contexto = ["docs/papers.md (Quality Not Just Outcome, ContextPilot, OPEN-SWE-TRACES)"]
objetivo = '''
1. `tqs(transcript)`: puntuación en [0, 1] en tiempo lineal y sin LLM: foco (fracción de lecturas de
   archivos que luego se editan o citan), convergencia (si los errores disminuyen hacia el final),
   redundancia (llamadas repetidas) y alineación intención-acción (si las tools usadas son coherentes
   con el texto previo, por heurística simple).
2. `export_jsonl(sessions)`: trazas en formato estable (mensajes y tool calls, incluidas las acciones
   de `contexto`), listas para afinar un modelo propio servido por LiteLLM.
'''
firmas = '''
pub struct TqsParts { pub focus: f32, pub convergence: f32, pub redundancy: f32, pub alignment: f32 }
pub fn tqs(transcript: &[pcode_backends::TranscriptItem]) -> (f32, TqsParts);
pub fn export_jsonl(sessions: &[(String, Vec<pcode_models::Message>)], out: &mut dyn std::io::Write) -> std::io::Result<()>;
'''
tests = ["tqs_trayectoria_enfocada_alta", "tqs_redundante_baja", "export_formato_estable"]
papers = ["Quality, Not Just Outcome (Findings EMNLP 2026)", "ContextPilot (EMNLP 2026)", "OPEN-SWE-TRACES (Findings EMNLP 2026)"]
