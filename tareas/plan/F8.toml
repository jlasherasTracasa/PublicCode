[[tarea]]
id = "F8.01"
nombre = "studio-modulos"
titulo = "Studio: separar el JS en módulos servidos por el demonio y tests con vitest + jsdom"
fase = "F8"
ejecutor = "coordinador"
depende = ["F5.35"]
toca = ["crates/pcode-server/web/index.html", "crates/pcode-server/web/studio/", "crates/pcode-server/src/server.rs", "apps/studio/package.json"]
acepta = "npm ci && npm run -w apps/studio test"
contexto = ["crates/pcode-server/web/index.html", "AGENTS.md (§6.4, sin CDN ni dependencias fuera de la lista)"]
objetivo = '''
1. Partir el `<script>` de `index.html` en módulos ES (`web/studio/rpc.js`, `editor.js`, `resaltado.js`, `arbol.js`,
   `git.js`, `terminal.js`, `agente.js`, `lsp.js`, `paleta.js`) que el demonio sirve con `include_str!` y CSP `'self'`.
2. `apps/studio` (workspace npm) con vitest + jsdom: un `rpc` falso y pruebas por módulo (resaltado, búsqueda difusa,
   diff, árbol, buscar/reemplazar). Versiones exactas y `package-lock.json` versionado.
3. Job `studio` en la CI que ejecuta esas pruebas.
'''
tests = ["resalta_rust_y_escapa_html", "puntua_prefiere_nombre", "diff_colorea_lineas", "buscar_reemplazar_cuenta_coincidencias"]

