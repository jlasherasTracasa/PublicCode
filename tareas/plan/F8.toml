[[tarea]]
id = "F8.23a"
nombre = "exportar-markdown"
titulo = "Exportar: conversación a Markdown y enmascarado de claves y rutas (lógica pura)"
fase = "F8"
hito = "1.3"
talla = "M"
ejecutor = "haiku"
depende = ["F5.29", "F5.06"]
toca = ["crates/pcode-cli/src/exportar.rs", "crates/pcode-cli/src/main.rs"]
acepta = "cargo test -p pcode-cli exportar::"
contexto = [
  "crates/pcode-models/src/types.rs (structs `Message { role, content, tool_calls, tool_call_id }` y `ToolCall { id, name, arguments }`; enum `Role`; constructores `Message::user`, `Message::assistant`, `Message::tool_result`)",
  "crates/pcode-cli/src/main.rs (las líneas `mod …;` del principio)",
]
objetivo = '''
1. Crea `exportar.rs` con `env_secrets`, `mask` y `to_markdown` (firmas abajo). Sin E/S.
2. `env_secrets(vars)`: valores de las variables cuyo NOMBRE, en mayúsculas, contiene `KEY`, `TOKEN`,
   `SECRET`, `PASSWORD` o `CLAVE`, y cuyo valor mide al menos 8 caracteres. Sin repetidos.
3. `mask(text, home, secrets)`: sustituye cada secreto por `•••` (primero los más largos) y, si `home` es
   `Some` y no está vacío ni es `/`, cada aparición de `home` por `~`.
4. `to_markdown(title, model, messages)` produce, en este orden:
   - `# <title>`, línea en blanco, `_Modelo: <model> · <n> mensajes_` (n = mensajes de usuario y asistente),
     línea en blanco.
   - Por cada mensaje: `Role::System` y `Role::Tool` no se escriben por sí mismos. `Role::User` →
     `## Usuario`, línea en blanco, el contenido, línea en blanco. `Role::Assistant` → `## Asistente`, línea
     en blanco, el contenido si no está vacío y línea en blanco; después, por cada `tool_call`, un bloque
     plegado (ver ejemplo): `<details><summary>🔧 <name></summary>`, los argumentos en JSON con sangría
     (`serde_json::to_string_pretty`) dentro de una valla de cuatro acentos graves con `json`, y la salida de
     la tool (el `content` del mensaje `Role::Tool` cuyo `tool_call_id` es el `id` de la llamada; recortado a
     4000 caracteres, con `\n[… recortado]` si se recorta; `(sin salida)` si no hay mensaje o está vacío)
     dentro de otra valla de cuatro acentos graves; y `</details>`.
5. `main.rs`: añade `mod exportar;` junto a los demás `mod`.
'''
firmas = '''
// crates/pcode-cli/src/exportar.rs
use pcode_models::Message;

/// Valores del entorno que parecen secretos (por el nombre de la variable).
pub fn env_secrets(vars: impl Iterator<Item = (String, String)>) -> Vec<String>;

/// Oculta los secretos (`•••`) y la carpeta personal (`~`).
pub fn mask(text: &str, home: Option<&str>, secrets: &[String]) -> String;

/// La conversación en Markdown, con las tools plegadas.
pub fn to_markdown(title: &str, model: &str, messages: &[Message]) -> String;
'''
ejemplo = '''
mensajes: system("…"), user("crea a.txt"), assistant("") con tool_call {id:"1", name:"escribir", arguments:{"path":"a.txt"}},
          tool_result("1", "escrito"), assistant("creado a.txt")
to_markdown("crea a.txt", "m", &mensajes) ==
# crea a.txt

_Modelo: m · 3 mensajes_

## Usuario

crea a.txt

## Asistente

<details><summary>🔧 escribir</summary>

````json
{
  "path": "a.txt"
}
````

````
escrito
````

</details>

## Asistente

creado a.txt

mask("clave sk-secreto-12345678 en /home/ana/p", Some("/home/ana"), &["sk-secreto-12345678".into()]) == "clave ••• en ~/p"
'''
tests = [
  "markdown_con_tools: la conversación del ejemplo da exactamente el texto del ejemplo",
  "markdown_salida_larga_se_recorta: una salida de tool de 5000 caracteres aparece con 4000 y `[… recortado]`",
  "markdown_tool_sin_resultado: una llamada sin mensaje `Tool` muestra `(sin salida)`",
  "oculta_claves_del_entorno: `env_secrets` de `[(\"OPENAI_API_KEY\",\"sk-secreto-12345678\"), (\"HOME\",\"/home/ana\"), (\"MI_TOKEN\",\"corto\")]` es `[\"sk-secreto-12345678\"]` y `mask` da el resultado del ejemplo",
  "mask_no_toca_la_raiz: con `home = Some(\"/\")` o `Some(\"\")` el texto no cambia",
]
no_hagas = [
  "No leas el entorno ni archivos en este módulo: los datos llegan por parámetro",
  "No añadas la orden `pcode exportar` todavía (es F8.23c)",
  "No uses vallas de tres acentos graves: el contenido puede traerlas",
]
notas = '''
Hasta F8.23c el módulo no se usa desde el binario: pon `#![allow(dead_code)] // se usa en F8.23c` al
principio de `exportar.rs`.
'''

[[tarea]]
id = "F8.23b"
nombre = "exportar-html"
titulo = "Exportar: conversación a HTML autocontenido (lógica pura)"
fase = "F8"
hito = "1.3"
talla = "S"
ejecutor = "haiku"
depende = ["F8.23a"]
toca = ["crates/pcode-cli/src/exportar.rs"]
acepta = "cargo test -p pcode-cli exportar::tests::html"
contexto = [
  "crates/pcode-cli/src/exportar.rs (función `to_markdown`: el mismo recorrido de mensajes y la misma forma de emparejar cada tool con su salida)",
]
objetivo = '''
1. Añade a `exportar.rs` las funciones `escape_html` y `to_html` (firmas abajo).
2. `escape_html`: `&` → `&amp;`, `<` → `&lt;`, `>` → `&gt;`, `"` → `&quot;` (el `&` primero).
3. `to_html` devuelve un documento completo: `<!doctype html>`, `<html lang="es">`, `<head>` con
   `<meta charset="utf-8">`, `<title>` (título escapado) y un único `<style>` en línea; `<body>` con `<h1>`
   (título), `<p class="meta">Modelo: … · n mensajes</p>` y, por cada mensaje (mismo recorrido que
   `to_markdown`):
   - usuario: `<section class="msg user"><h2>Usuario</h2><pre>contenido escapado</pre></section>`
   - asistente: `<section class="msg assistant"><h2>Asistente</h2>` + `<pre>contenido</pre>` si no está vacío +
     por cada tool `<details class="tool"><summary>🔧 nombre</summary><pre>argumentos</pre><pre>salida</pre></details>`
     + `</section>`.
   Todo el texto que venga de los mensajes pasa por `escape_html`.
4. El `<style>` usa estos colores: fondo `#0b1220`, texto `#d3e3fd`, acento `#8ab4f8`, fondo de `pre`
   `#182b46`; con `@media (prefers-color-scheme: light)`: fondo `#ffffff`, texto `#041e49`, acento `#0b57d0`,
   fondo de `pre` `#eaf2fd`. `pre { white-space: pre-wrap; }`. Fuente: `system-ui, sans-serif` (ninguna
   fuente remota).
