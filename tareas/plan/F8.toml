[[tarea]]
id = "F8.51a"
nombre = "borradores-nucleo"
titulo = "Borradores: clave, estado frente al disco y limpieza (módulo puro `borradores.js`)"
fase = "F8"
hito = "1.6"
talla = "S"
ejecutor = "haiku"
depende = ["F8.01"]
toca = ["crates/pcode-server/web/studio/borradores.js", "crates/pcode-server/web/studio/test/borradores.test.js"]
acepta = "node --test crates/pcode-server/web/studio/test/borradores.test.js"
contexto = [
  "crates/pcode-server/web/studio/difusa.js (forma de un módulo puro)",
  "crates/pcode-server/web/studio/test/difusa.test.js (forma de un test)",
]
lenguaje = "javascript"
objetivo = '''
Un borrador es lo que el usuario tecleó y aún no guardó; se guarda en `localStorage` como JSON
`{ content, base, at }`: el texto, la huella del contenido del disco del que partía y la hora (ms).
1. Crea `borradores.js` con las funciones de las firmas (sin tocar `localStorage`: eso lo hace `index.html`).
2. `PREFIX = "pcode.borrador."` y `draftKey(project, path)` = `PREFIX + project + ":" + path`.
3. `hash(text)`: huella determinista djb2: empieza en 5381 y, por cada unidad de `text`,
   `h = ((h * 33) ^ text.charCodeAt(i)) >>> 0`; devuelve `h.toString(16)`.
4. `makeDraft(content, saved, now)` = `{ content, base: hash(saved), at: now }`.
   `parseDraft(json)`: devuelve el objeto si el JSON es válido y tiene `content` de tipo cadena, `base`
   de tipo cadena y `at` numérico; en cualquier otro caso (también `null`), `null`.
5. `status(draft, disk)`: `"none"` si no hay borrador o su `content` es igual a `disk`; `"recover"` si
   `draft.base === hash(disk)` (el disco no cambió desde el borrador); `"conflict"` en otro caso.
6. `prune(entries, max)`: `entries` es `[{ key, at }]`; devuelve las claves que hay que borrar para que
   queden las `max` más recientes (las de `at` menor primero).
7. Crea `borradores.test.js` con los tests de la lista.
'''
firmas = '''
// crates/pcode-server/web/studio/borradores.js
/** Prefijo de las claves de borradores en localStorage. */
export const PREFIX = "pcode.borrador.";
/** Clave de un borrador. */
export function draftKey(project, path) {}
/** Huella determinista de un texto (djb2 en hexadecimal). */
export function hash(text) {}
/** Borrador nuevo: { content, base, at }. */
export function makeDraft(content, saved, now) {}
/** Borrador leído de localStorage, o null si no es válido. */
export function parseDraft(json) {}
/** "none" | "recover" | "conflict". */
export function status(draft, disk) {}
/** Claves que sobran para quedarse con las `max` más recientes. */
export function prune(entries, max) {}
'''
ejemplo = '''
draftKey("app", "src/main.rs")              -> "pcode.borrador.app:src/main.rs"
hash("")                                    -> "1505"            // 5381 en hexadecimal
makeDraft("nuevo", "viejo", 1700)           -> { content: "nuevo", base: hash("viejo"), at: 1700 }
status(null, "viejo")                                   -> "none"
status(makeDraft("nuevo", "viejo", 1), "nuevo")         -> "none"       // ya está guardado
status(makeDraft("nuevo", "viejo", 1), "viejo")         -> "recover"
status(makeDraft("nuevo", "viejo", 1), "otra cosa")     -> "conflict"   // el archivo cambió en disco
parseDraft('{"content":"x","base":"1505","at":3}')      -> { content: "x", base: "1505", at: 3 }
parseDraft("no es json")                                -> null
prune([{ key: "a", at: 3 }, { key: "b", at: 1 }, { key: "c", at: 2 }], 2) -> ["b"]
'''
tests = [
  "clave_por_proyecto_y_ruta: el caso de `draftKey` del ejemplo",
  "huella_determinista: `hash(\"\")` es `1505`, `hash(\"a\")` es igual en dos llamadas y distinta de `hash(\"b\")`",
  "estado_del_borrador: los cuatro casos de `status` del ejemplo",
  "borrador_invalido_es_null: `parseDraft` devuelve `null` para `null`, texto que no es JSON, `{}` y un objeto con `content` numérico",
  "borrador_valido_se_lee: el caso válido de `parseDraft` del ejemplo",
  "limpieza_conserva_los_recientes: el caso de `prune` del ejemplo; con `max` mayor que la lista devuelve `[]`",
]
no_hagas = ["No uses `localStorage`, `document`, `window`, `Date` ni imports en `borradores.js`"]

[[tarea]]
id = "F8.51b"
nombre = "borradores-cableado"
titulo = "Borradores: guardar lo tecleado en `localStorage`, ofrecer recuperarlo al abrir y guardado automático"
fase = "F8"
hito = "1.6"
talla = "M"
ejecutor = "haiku"
depende = ["F8.51a"]
toca = ["crates/pcode-server/web/index.html", "crates/pcode-server/src/web_assets.rs"]
acepta = "node --test crates/pcode-server/web/studio/test/borradores.test.js && cargo test -p pcode-server web_assets:: && grep -q 'Studio.borradores.status' crates/pcode-server/web/index.html && grep -q 'pcode.autoguardado' crates/pcode-server/web/index.html"
contexto = [
  "crates/pcode-server/web/index.html (el `ta.addEventListener(\"input\"`; funciones `abre`, `guarda`, `cierra` y `aviso` (su tercer parámetro es `[texto, función]`); `recuerda`: cómo se usa `localStorage` con `try` y el nombre del proyecto `$(\"proyecto\").textContent`; `ORDENES`)",
  "crates/pcode-server/web/studio/borradores.js (`draftKey`, `makeDraft`, `parseDraft`, `status`, `prune`, `PREFIX`)",
  "crates/pcode-server/src/web_assets.rs (tabla `ASSETS`)",
]
sin_firmas = "solo cableado en index.html y una línea en la tabla ASSETS: no añade API"
objetivo = '''
1. `web_assets.rs`: añade `("borradores.js", include_str!("../web/studio/borradores.js")),` a `ASSETS`.
   `index.html`, bloque `<script type="module">` final, antes de `inicio();`:
   `import * as borradores from "/studio/borradores.js"; Studio.borradores = borradores;`.
2. Debajo de `guarda` añade (todo acceso a `localStorage` va dentro de `try { … } catch { }`):
   - `claveBorrador(t)`: `Studio.borradores.draftKey($("proyecto").textContent || "", t.path)`.
   - `guardaBorrador(t)`: si `t.dirty` y `t.content.length <= 500000`, guarda
     `JSON.stringify(Studio.borradores.makeDraft(t.content, t.saved, Date.now()))`; si no está sucia,
     borra la clave. Después limpia: reúne las claves de `localStorage` que empiezan por
     `Studio.borradores.PREFIX` con su `at` y borra las que devuelva `Studio.borradores.prune(lista, 30)`.
   - `autoguardado()`: `true` si `localStorage.getItem("pcode.autoguardado") === "1"`.
3. `ta.addEventListener("input"`: al final, reinicia un temporizador (`let tBorrador = 0;` fuera del
   manejador; `clearTimeout(tBorrador); tBorrador = setTimeout(…, 800)`) que llama a `guardaBorrador(t)` y,
   si `autoguardado()` y `t` sigue siendo la pestaña activa y está sucia, a `guarda(true)`.
4. `guarda`: admite un parámetro `silencio`; con `true` no muestra el aviso «Guardado …». Tras guardar
   bien, borra el borrador (`localStorage.removeItem(claveBorrador(t))`). `cierra`: cuando el usuario
   confirma cerrar una pestaña sucia, borra también su borrador.
5. `abre`: después de crear la pestaña y activarla, lee
   `d = Studio.borradores.parseDraft(localStorage.getItem(claveBorrador(t)))` y
   `st = Studio.borradores.status(d, f.content)`. Si `st` es `"recover"` o `"conflict"`, muestra
   `aviso("Hay cambios sin guardar de " + base(path) + (st === "conflict" ? " (el archivo cambió en disco)" : ""), "", ["Recuperar", () => { … }])`;
   al recuperar: `t.content = d.content; t.dirty = true; pintaPestanas(); if (S.activa === t.id) muestra();`.
   Si `st` es `"none"` y había borrador, bórralo.
6. Añade a `ORDENES`: `["Guardado automático: activar o desactivar", "", …]` (alterna `pcode.autoguardado`
   entre `"1"` y ausente y avisa del estado) y `["Borradores: descartar todos", "", …]` (borra todas las
   claves con `PREFIX`).
'''
tests = [
  "(sin tests nuevos): `borradores.test.js` sigue pasando; `index_solo_importa_modulos_registrados` de `web_assets.rs` comprueba el registro del módulo",
]
no_hagas = [
  "No recuperes un borrador sin que el usuario pulse «Recuperar»",
  "No guardes borradores de archivos binarios ni de más de 500000 caracteres",
  "No cambies el aviso de `beforeunload` que ya existe",
]

