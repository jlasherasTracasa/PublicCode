[[tarea]]
id = "F8.04a"
nombre = "comparar-nucleo"
titulo = "Comparar: diff por líneas y filas para dos columnas (módulo puro `comparar.js`)"
fase = "F8"
hito = "1.6"
talla = "M"
ejecutor = "haiku"
