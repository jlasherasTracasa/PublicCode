[[tarea]]
id = "F8.02a"
nombre = "plegado-nucleo"
titulo = "Plegado: rangos por sangría y proyección del texto (módulo puro `plegado.js`)"
fase = "F8"
hito = "1.6"
talla = "M"
ejecutor = "haiku"
depende = ["F8.01"]
toca = ["crates/pcode-server/web/studio/plegado.js", "crates/pcode-server/web/studio/test/plegado.test.js"]
acepta = "node --test crates/pcode-server/web/studio/test/plegado.test.js"
contexto = [
  "crates/pcode-server/web/studio/difusa.js (forma de un módulo: funciones `export`, sin DOM ni imports)",
  "crates/pcode-server/web/studio/test/difusa.test.js (forma de un test con `node:test` y `node:assert/strict`)",
]
lenguaje = "javascript"
objetivo = '''
1. Crea `plegado.js` con las cinco funciones de las firmas. Las líneas se numeran desde 0 y salen de
   `text.split("\n")`. La sangría de una línea es su ancho en columnas: un espacio suma 1 y un tabulador
   lleva a la siguiente columna múltiplo de `tabSize`. Una línea en blanco (vacía o solo espacios) no
   tiene sangría: nunca empieza un rango y no corta un bloque.
2. `foldRanges`: la línea `i` (no en blanco) empieza un rango si la siguiente línea no en blanco tiene
   más sangría que ella. `end` es la última línea no en blanco anterior a la primera línea no en blanco
   con sangría menor o igual que la de `i` (o la última no en blanco del texto). Devuelve los rangos
   ordenados por `start`.
3. `project(text, ranges, folded)`: `folded` es una lista de `start`. Quita las líneas `start+1..=end` de
   cada rango plegado (los `start` que no correspondan a ningún rango se ignoran; los rangos anidados no
   quitan dos veces). Devuelve `{ shown, lines }`: `shown` es el texto que queda y `lines[i]` es el número
   de línea real de la línea `i` de `shown`.
4. `toRealOffset` y `toShownOffset` convierten posiciones (índices de carácter) entre `shown` y `text`
   usando `lines`. Si la posición real cae en una línea oculta, `toShownOffset` devuelve el final de la
   línea visible anterior (la cabecera del pliegue). `rangeAt` devuelve el rango más interno (el de
   `start` mayor) que contiene la línea, o `null`.
5. Crea `plegado.test.js` con los tests de la lista (importa de `../plegado.js`).
'''
firmas = '''
// crates/pcode-server/web/studio/plegado.js
/** Rangos plegables por sangría: [{ start, end }] (líneas desde 0), ordenados por `start`. */
export function foldRanges(text, tabSize = 4) {}
/** Texto sin las líneas ocultas de los rangos plegados: { shown: string, lines: number[] }. */
export function project(text, ranges, folded) {}
/** Posición en `shown` → posición en el texto real. */
export function toRealOffset(text, lines, shownOffset) {}
/** Posición en el texto real → posición en `shown`. */
export function toShownOffset(text, lines, realOffset) {}
/** Rango más interno que contiene `line`, o null. */
export function rangeAt(ranges, line) {}
'''
ejemplo = '''
const T = "fn a() {\n    if x {\n        y();\n    }\n}\n\nfn b() {}\n";   // 8 líneas (la última, vacía)
foldRanges(T)                         -> [{ start: 0, end: 3 }, { start: 1, end: 2 }]
project(T, foldRanges(T), [1])        -> { shown: "fn a() {\n    if x {\n    }\n}\n\nfn b() {}\n", lines: [0, 1, 3, 4, 5, 6, 7] }
project(T, foldRanges(T), [0, 1])     -> { shown: "fn a() {\n}\n\nfn b() {}\n", lines: [0, 4, 5, 6, 7] }
toRealOffset(T, [0, 1, 3, 4, 5, 6, 7], 20)   -> 33    (inicio de la línea real 3)
toShownOffset(T, [0, 1, 3, 4, 5, 6, 7], 33)  -> 20
toShownOffset(T, [0, 1, 3, 4, 5, 6, 7], 25)  -> 19    (línea 2 oculta: final de la línea 1)
rangeAt(foldRanges(T), 2)             -> { start: 1, end: 2 }
'''
tests = [
  "rangos_por_sangria: el texto `T` del ejemplo da los dos rangos del ejemplo",
  "rangos_de_python: `def f():\\n    a\\n\\n    b\\nc\\n` da un solo rango `{ start: 0, end: 3 }` (la línea en blanco no corta el bloque)",
  "tabuladores_cuentan_como_sangria: `a\\n\\tb\\nc` da `{ start: 0, end: 1 }`",
  "sin_bloques_no_hay_rangos: `a\\nb\\nc` y la cadena vacía dan `[]`",
  "proyectar_oculta_lineas_y_numeracion_sigue: `project(T, r, [1])` da el `shown` y `lines` del ejemplo",
  "plegados_anidados_no_quitan_dos_veces: `project(T, r, [0, 1])` da el resultado del ejemplo",
  "sin_plegados_es_identidad: `project(T, r, [])` devuelve `shown === T` y `lines` de 0 a 7",
  "offsets_ida_y_vuelta: los tres casos de `toRealOffset` y `toShownOffset` del ejemplo",
  "rango_mas_interno: `rangeAt(r, 2)` es el rango de `start` 1 y `rangeAt(r, 6)` es `null`",
]
no_hagas = ["No uses `document`, `window` ni imports en `plegado.js`", "No toques `index.html` en esta tarea"]

[[tarea]]
id = "F8.02b"
nombre = "plegado-cableado"
titulo = "Plegado: triángulos en el margen, Ctrl+Mayús+[ y ], y vista plegada de solo lectura"
fase = "F8"
hito = "1.6"
talla = "M"
ejecutor = "haiku"
depende = ["F8.02a"]
toca = ["crates/pcode-server/web/index.html", "crates/pcode-server/src/web_assets.rs"]
acepta = "node --test crates/pcode-server/web/studio/test/plegado.test.js && cargo test -p pcode-server web_assets:: && grep -q 'Studio.plegado.project' crates/pcode-server/web/index.html && grep -q 'function despliegaTodo' crates/pcode-server/web/index.html"
contexto = [
  "crates/pcode-server/web/index.html (bloque «Pestañas y editor»: funciones `muestra`, `repinta`, `posicion`, `irALinea` y el primer `ta.addEventListener(\"keydown\"`; `pintaMarcas`: cómo se pinta una capa en el margen; `ORDENES` y el `document.addEventListener(\"keydown\"` final: atajos)",
  "crates/pcode-server/web/studio/plegado.js (las cinco funciones que se usan)",
  "crates/pcode-server/src/web_assets.rs (tabla `ASSETS`)",
]
sin_firmas = "solo cableado en index.html y una línea en la tabla ASSETS: no añade API"
objetivo = '''
El editor es un `<textarea id="ta">` y todo el código usa `ta.value` como texto real. Por eso el plegado
es una **vista de solo lectura**: con algo plegado, `ta` muestra la proyección y `ta.readOnly = true`; el
texto real sigue en `t.content`. En cuanto el usuario teclea o una función necesita posiciones reales,
se despliega todo.
1. `web_assets.rs`: añade `("plegado.js", include_str!("../web/studio/plegado.js")),` a `ASSETS`.
   `index.html`, bloque `<script type="module">` final, antes de `inicio();`:
   `import * as plegado from "/studio/plegado.js"; Studio.plegado = plegado;`.
2. HTML y CSS: dentro de `#gutter`, tras `<div id="capa-git"></div>`, añade `<div id="capa-pliegue"></div>`.
   CSS: `#capa-pliegue .pl { position: absolute; left: 2px; height: 21px; cursor: pointer; }` y
   `.editor.plegado .capa-diag, .editor.plegado #capa-git { display: none; }`.
3. Debajo de `repinta` añade (estado: `t.plegadas`, lista de `start` por pestaña; `S.pliegue`, la
   proyección activa o `null`):
   - `aplicaPlegado()`: con `t = tabActiva()` de tipo `file`; si `t.plegadas?.length`, calcula
     `r = Studio.plegado.foldRanges(t.content)` y `S.pliegue = Studio.plegado.project(t.content, r, t.plegadas)`,
     pone `ta.value = S.pliegue.shown` y `ta.readOnly = true`; si no, `S.pliegue = null`,
     `ta.readOnly = false` y `ta.value = t.content`. Después: `$("editor").classList.toggle("plegado", !!S.pliegue)`,
     `gutter.dataset.n = ""`, `repinta()`, `sincroniza()`, `pintaPliegues()`.
   - `despliegaTodo()`: si `!S.pliegue`, no hace nada; si no, guarda
     `pos = Studio.plegado.toRealOffset(t.content, S.pliegue.lines, ta.selectionStart)`, vacía `t.plegadas`,
     llama a `aplicaPlegado()` y hace `ta.setSelectionRange(pos, pos)`.
   - `alternaPliegue(start)`: oculta `#buscador`, añade o quita `start` de `t.plegadas` (créala si falta) y
     llama a `aplicaPlegado()`.
   - `pintaPliegues()`: vacía `#capa-pliegue`; si el texto pasa de 300000 caracteres, sale. Para cada rango
     de `foldRanges(t.content)` cuyo `start` sea visible (`fila = S.pliegue ? S.pliegue.lines.indexOf(start) : start`,
     `fila >= 0`) añade `el("div", "pl", plegado ? "▸" : "▾")` con `style.top = fila * 21 + "px"` y
     `onclick = () => alternaPliegue(start)`.
4. Cambios en funciones existentes:
   - `muestra`: justo después de `ta.value = t.content;` añade `aplicaPlegado();`.
   - `repinta`: si `S.pliegue`, `#numeros` muestra `S.pliegue.lines.map((l) => l + 1).join("\n")`; al final
     llama a `pintaPliegues()` solo cuando cambie el número de líneas (dentro del `if` que ya existe).
   - `posicion`: la línea que se muestra es `S.pliegue ? S.pliegue.lines[antes.length - 1] + 1 : antes.length`.
   - Primera línea de `irALinea`, `selecciona`, `posCursor`, `selLineas`, `preguntaSeleccion` y de
     `buscador` (solo si `abrir`): `despliegaTodo();`. En `posRaton`: `if (S.pliegue) return null;`.
   - Primer `ta.addEventListener("keydown"` (el de Tab e Intro), al principio:
     `if (S.pliegue && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key.length === 1 || ["Enter", "Backspace", "Delete", "Tab"].includes(e.key))) despliegaTodo();`.
5. Atajos, en el `document.addEventListener("keydown"` final, antes de la rama de `k === "s"`:
   Ctrl+Mayús+`[` (`e.code === "BracketLeft"`) pliega el rango de la línea del cursor
   (`Studio.plegado.rangeAt(rangos, lineaReal)`), Ctrl+Mayús+`]` (`e.code === "BracketRight"`) llama a
   `despliegaTodo()`. Añade a `ORDENES`: `["Plegar el bloque del cursor", "Ctrl Mayús [", …]` y
   `["Desplegar todo", "Ctrl Mayús ]", () => despliegaTodo()]`.
'''
tests = [
