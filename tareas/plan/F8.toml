  "crates/pcode-core/src/checkpoint.rs (`Checkpoints::list() -> Vec<TurnInfo { turn, undone, … }>` del más reciente al más antiguo, `changes(turn)`, `file_diff(turn, path)`, `revert_file(turn, path)`)",
