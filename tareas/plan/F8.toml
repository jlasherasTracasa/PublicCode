    ToggleEntry(usize),

// crates/pcode-tui/src/render.rs
/// Zona de la pantalla donde se dibuja la transcripción.
pub fn body_area(app: &App, area: ratatui::layout::Rect) -> ratatui::layout::Rect;
/// Índice de la entrada dibujada en esa celda (`None` fuera de la transcripción).
pub fn entry_at(app: &App, area: ratatui::layout::Rect, col: u16, row: u16) -> Option<usize>;
'''
