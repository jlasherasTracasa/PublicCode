  "packaging/linux/pcode.desktop (entrada del menú que se instala en /usr/share/applications; `packaging/linux/pcode.svg` es el icono)",
  "tools/bench/test_rendimiento.py (cabecera: cómo un test importa el módulo de su misma carpeta con `sys.path.insert`)",
