// crates/pcode-protocol/src/lib.rs, en `pub mod methods`
pub const GIT_BRANCHES: &str = "git.branches";
pub const GIT_CHECKOUT: &str = "git.checkout";
pub const GIT_PULL: &str = "git.pull";
pub const GIT_PUSH: &str = "git.push";

// Ya existen (F8.11b y F8.11c):
// crate::branches::git_branches(root: &Path) -> WsResult<Vec<Branch>>
// crate::branches::git_checkout(root: &Path, name: &str, create: bool) -> WsResult<()>
// crate::branches::git_pull(root: &Path) -> WsResult<String>   (async)
// crate::branches::git_push(root: &Path) -> WsResult<String>   (async)
