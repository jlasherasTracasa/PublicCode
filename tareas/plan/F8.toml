/** Movimiento con el teclado en un árbol: { index, action: null | "expand" | "collapse" } o null. */
export function treeMove(items, index, key) {}
/** Índice de la pestaña a la que lleva la tecla, o null. */
export function tabMove(count, index, key) {}
'''
ejemplo = '''
nextZone(["explorador", "editor", "agente"], "editor", 1)    -> "agente"
nextZone(["explorador", "editor", "agente"], "agente", 1)    -> "explorador"
nextZone(["explorador", "editor", "agente"], "terminal", -1) -> "agente"
const A = [ { level: 0, expanded: true }, { level: 1, expanded: null }, { level: 1, expanded: false }, { level: 0, expanded: null } ];
treeMove(A, 0, "ArrowDown")  -> { index: 1, action: null }
treeMove(A, 0, "ArrowRight") -> { index: 1, action: null }        // abierta: va al primer hijo
treeMove(A, 2, "ArrowRight") -> { index: 2, action: "expand" }
treeMove(A, 0, "ArrowLeft")  -> { index: 0, action: "collapse" }
treeMove(A, 1, "ArrowLeft")  -> { index: 0, action: null }        // va al padre
treeMove(A, 3, "ArrowDown")  -> { index: 3, action: null }
tabMove(3, 2, "ArrowRight")  -> 0        tabMove(3, 0, "ArrowLeft") -> 2        tabMove(3, 1, "End") -> 2
'''
tests = [
