// crates/pcode-tools/src/lsp_tools.rs (añadir)
/// Tool `diagnosticos`.
pub struct Diagnostics { /* manager: Arc<pcode_lsp::LspManager>, store: DiagStore */ }
/// Tool `definicion`.
pub struct Definition { /* igual */ }
/// Tool `referencias`.
pub struct References { /* igual */ }

/// Las tres tools sobre un gestor ya creado (su sumidero debe ser `store.sink()`).
pub fn lsp_tools(manager: std::sync::Arc<pcode_lsp::LspManager>, store: DiagStore)
    -> Vec<std::sync::Arc<dyn crate::Tool>>;
/// Las tres tools para un proyecto; `overrides` es la orden por grupo (`[lsp.<grupo>]` de la configuración).
pub fn lsp_tools_for(root: &Path, overrides: std::collections::HashMap<String, Vec<String>>)
    -> Vec<std::sync::Arc<dyn crate::Tool>>;
