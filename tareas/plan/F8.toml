firmas = '''
// crates/pcode-server/src/server.rs (impl AppState)
/// Añade una carpeta extra (la elige quien arranca el demonio) y devuelve su nombre.
pub fn add_root(&self, path: &std::path::Path) -> Result<String, String>;
/// Raíz a la que se refiere una petición: su parámetro `root` (ausente o vacío = la principal).
