[[tarea]]
id = "F8.50a"
nombre = "sesion-web-nucleo"
titulo = "Enlace de un solo uso: canje del token y cookies de sesión (`web_session.rs`, lógica pura)"
fase = "F8"
hito = "1.5"
talla = "S"
ejecutor = "haiku"
depende = ["F5.32"]
toca = ["crates/pcode-server/src/web_session.rs", "crates/pcode-server/src/lib.rs"]
acepta = "cargo test -p pcode-server web_session::"
contexto = ["crates/pcode-server/src/server.rs (funciones `authorized` e `index`: cómo se compara hoy el token y se pone la cookie `pcode_token`)"]
objetivo = '''
1. Crea `web_session.rs` con `constant_time_eq`, `Redeem` y `WebSessions` (firmas abajo). Sin E/S ni
   aleatoriedad: el valor de la cookie nueva lo pasa quien llama.
2. `constant_time_eq(a, b)`: `false` si las longitudes difieren; si no, recorre todos los bytes
   acumulando `a[i] ^ b[i]` con `|=` y devuelve `acumulado == 0` (sin salir antes).
3. `redeem(presented, token, fresh)`: si `presented` no es igual a `token` (con `constant_time_eq`),
   `Redeem::Wrong`. Si el modo de un solo uso está apagado, `Redeem::Legacy`. Si está encendido y el
   enlace ya se canjeó, `Redeem::AlreadyUsed`; si no, lo marca como canjeado, guarda `fresh` como cookie
   válida (como mucho `MAX_WEB_SESSIONS`: al pasar, se descarta la más antigua) y devuelve
   `Redeem::Session(fresh)`.
4. `is_valid(cookie)`: `true` si `cookie` es una de las guardadas (comparadas con `constant_time_eq`).
5. `lib.rs`: añade `pub mod web_session;` (después de `pub mod settings;`). Tests en `web_session.rs`.
'''
firmas = '''
// crates/pcode-server/src/web_session.rs
/// Sesiones de navegador que se guardan como mucho.
pub const MAX_WEB_SESSIONS: usize = 16;

/// Compara dos cadenas sin que el tiempo dependa de dónde difieren.
pub fn constant_time_eq(a: &str, b: &str) -> bool;

/// Resultado de canjear el token de la URL.
#[derive(Debug, Clone, PartialEq, Eq)]
pub enum Redeem {
    /// Modo antiguo: el token vale siempre y la cookie es el propio token.
    Legacy,
    /// Canje correcto: valor de la cookie de sesión nueva.
    Session(String),
    /// El enlace ya se usó.
    AlreadyUsed,
    /// El token no es el del demonio.
    Wrong,
}

/// Estado del canje del enlace y cookies de sesión válidas.
#[derive(Debug, Default)]
pub struct WebSessions { single_use: bool, used: bool, cookies: Vec<String> }

impl WebSessions {
    /// Activa o desactiva el enlace de un solo uso.
    pub fn set_single_use(&mut self, on: bool);
    /// Está activo el enlace de un solo uso.
    pub fn single_use(&self) -> bool;
    /// Canjea el token presentado en la URL.
    pub fn redeem(&mut self, presented: &str, token: &str, fresh: String) -> Redeem;
    /// La cookie de sesión es válida.
    pub fn is_valid(&self, cookie: &str) -> bool;
}
'''
ejemplo = '''
let mut w = WebSessions::default();
w.redeem("tk", "tk", "c1".into())    -> Redeem::Legacy        // modo antiguo, se puede repetir
w.set_single_use(true);
w.redeem("mal", "tk", "c1".into())   -> Redeem::Wrong         // no gasta el enlace
w.redeem("tk", "tk", "c1".into())    -> Redeem::Session("c1")
w.redeem("tk", "tk", "c2".into())    -> Redeem::AlreadyUsed
w.is_valid("c1") -> true             w.is_valid("c2") -> false            w.is_valid("tk") -> false
'''
tests = [
  "comparacion_en_tiempo_constante: `constant_time_eq` es `true` para cadenas iguales y `false` para distinta longitud o un byte distinto",
  "modo_antiguo_no_gasta_el_enlace: sin `set_single_use`, dos canjes seguidos con el token correcto dan `Legacy`",
  "un_solo_uso_canjea_una_vez: con un solo uso, el primer canje da `Session(\"c1\")` y el segundo `AlreadyUsed`",
  "token_incorrecto_no_gasta_el_enlace: un canje con `mal` da `Wrong` y el siguiente con el token correcto da `Session`",
  "la_cookie_canjeada_es_valida: tras el canje, `is_valid(\"c1\")` es `true` y `is_valid(\"tk\")` es `false`",
  "se_guardan_como_mucho_dieciseis: tras llamar 17 veces a `remember` con valores distintos, la primera cookie deja de ser válida y la última sí lo es",
]
no_hagas = ["No generes valores aleatorios en este módulo", "No toques `server.rs` en esta tarea", "No añadas dependencias"]
notas = '''
Para el test del límite, añade un método `fn remember(&mut self, cookie: String)` (privado, lo usa
`redeem`) que guarda la cookie y aplica el límite; el test lo llama 17 veces.
'''

[[tarea]]
id = "F8.50b"
nombre = "sesion-web-servidor"
titulo = "Enlace de un solo uso: `index` canjea el token, `authorized` acepta la cookie de sesión y `pcode studio` lo activa"
fase = "F8"
hito = "1.5"
talla = "M"
ejecutor = "haiku"
depende = ["F8.50a"]
toca = ["crates/pcode-server/src/server.rs", "crates/pcode-cli/src/main.rs", "tools/studio/e2e.js"]
toca_extra = ["crates/pcode-server/Cargo.toml"]
acepta = "cargo test -p pcode-server server::tests::enlace_ && cargo test -p pcode-server server::tests::web_ && grep -q 'set_single_use_url(true)' crates/pcode-cli/src/main.rs && grep -q 'enlace-reutilizable' tools/studio/e2e.js"
contexto = [
  "crates/pcode-server/src/server.rs (struct `AppState`, `AppState::new` y `set_global_config`; funciones `authorized` e `index`; módulo `tests`, función `web_con_token_pone_cookie`)",
  "crates/pcode-server/src/web_session.rs (`WebSessions`, `Redeem`)",
  "crates/pcode-cli/src/main.rs (variante `Cmd::Studio` y las ramas `Cmd::Studio` y `Cmd::Ide` de `main`: dónde se crea `AppState`)",
]
objetivo = '''
1. `Cargo.toml` de `pcode-server`: añade `uuid = { version = "1", features = ["v4"] }` a `[dependencies]`
   (la misma línea que usa `pcode-cli`).
2. `server.rs`, `AppState`: campo `web: Mutex<crate::web_session::WebSessions>` (en `new`,
   `Mutex::new(Default::default())`) y el método `set_single_use_url` de las firmas.
3. `authorized`: la cabecera `Authorization: Bearer <token>` no cambia. La cookie vale si
   (a) el modo de un solo uso está apagado y es `pcode_token=<token>` (como hoy), o
   (b) es `pcode_sesion=<valor>` y `st.web.lock().unwrap().is_valid(valor)`.
4. `index`: si `authorized` ya es `true`, sirve la página sin tocar cookies. Si no, y hay `?t=` y token
   configurado, llama a
   `st.web.lock().unwrap().redeem(t_presentado, token, format!("{}{}", uuid::Uuid::new_v4().simple(), uuid::Uuid::new_v4().simple()))`:
   - `Redeem::Legacy`: sirve la página con la cookie de hoy (`pcode_token=<token>; HttpOnly; SameSite=Strict; Path=/`);
   - `Redeem::Session(v)`: sirve la página con `pcode_sesion=<v>; HttpOnly; SameSite=Strict; Path=/`;
   - `Redeem::AlreadyUsed`: 401 con el cuerpo de texto
     `Este enlace ya se usó. Vuelve a ejecutar pcode studio para obtener otro.`;
   - `Redeem::Wrong` (o sin `?t=`): 401 como hoy.
   Las cabeceras de seguridad (CSP, `nosniff`, `Referrer-Policy`) no cambian.
5. `main.rs`: añade a `Cmd::Studio` la opción oculta
   `#[arg(long = "enlace-reutilizable", hide = true)] reusable_link: bool,` (para pruebas con varios
   navegadores). En la rama `Cmd::Studio`, tras crear `st`: `st.set_single_use_url(!reusable_link);`. En la
   rama `Cmd::Ide`, tras crear `st`: `st.set_single_use_url(true);`. La rama `Cmd::Daemon` no cambia.
6. `e2e.js` (en `tools/studio/`): en la llamada `spawn(PCODE, ['studio', '--no-abrir', '--puerto', '0'], …)`
   añade `'--enlace-reutilizable'` a la lista (esa prueba abre el mismo enlace en varios navegadores).
7. Tests en el módulo `tests` de `server.rs` (nombres con prefijo `enlace_`).
'''
firmas = '''
// crates/pcode-server/src/server.rs (impl AppState)
/// Con `true`, el token de la URL (`/?t=…`) solo se puede canjear una vez por una cookie de sesión.
pub fn set_single_use_url(&self, on: bool);
'''
ejemplo = '''
// st.set_single_use_url(true) con token "tk"
GET /?t=tk                      -> 200, Set-Cookie: pcode_sesion=<64 hex>; HttpOnly; SameSite=Strict; Path=/
GET /?t=tk   (otra vez, sin cookie) -> 401, cuerpo "Este enlace ya se usó. Vuelve a ejecutar pcode studio para obtener otro."
GET /        con Cookie: pcode_sesion=<ese valor>   -> 200
POST /rpc    con Cookie: pcode_sesion=<ese valor>   -> 200
POST /rpc    con Cookie: pcode_token=tk             -> 401     (la cookie antigua ya no vale en este modo)
POST /rpc    con Authorization: Bearer tk           -> 200     (los clientes de la API no cambian)
'''
tests = [
  "enlace_de_un_solo_uso_se_canjea_una_vez: el primer GET `/?t=tk` da 200 con cookie `pcode_sesion=`; el segundo, sin cookie, da 401 y el cuerpo contiene `ya se usó`",
  "enlace_la_cookie_de_sesion_autoriza_rpc: con la cookie devuelta, `server.info` por `/rpc` responde 200; con `pcode_token=tk` responde 401",
  "enlace_bearer_sigue_valiendo: con un solo uso activo y el enlace ya canjeado, `Authorization: Bearer tk` responde 200 en `/rpc`",
  "enlace_token_incorrecto_no_lo_gasta: GET `/?t=mal` da 401 y después GET `/?t=tk` da 200",
  "enlace_modo_antiguo_no_cambia: sin `set_single_use_url`, dos GET `/?t=tk` seguidos dan 200 (como `web_con_token_pone_cookie`)",
]
no_hagas = [
  "No cambies la firma de `AppState::new`, `authorized` ni `router`",
  "No actives el enlace de un solo uso en `pcode daemon`",
  "No registres el token ni la cookie en logs",
]
notas = '''
`tools/bench/rendimiento.py` abre el enlace una sola vez y después usa `Bearer`: sigue funcionando.
Si existe la ruta `/studio/{name}`, usa `authorized` y no necesita cambios.
'''

