export const MAX_BUFFER = 200000;
export function initial() {}
export function addTab(state) {}
export function closeTab(state, id) {}
export function setActive(state, id) {}
export function title(command) {}                        // → string
export function append(state, tabId, text) {}
export function started(state, tabId, proc, command) {}
export function output(state, proc, text) {}
export function exited(state, proc, code) {}
export function tabOf(state, proc) {}                    // → pestaña | null
export function activeTab(state) {}                      // → pestaña | null
'''
