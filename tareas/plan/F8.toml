[[tarea]]
id = "F8.29a"
nombre = "apk-eventos-nucleo"
titulo = "APK: leer los eventos SSE del demonio y decidir qué se notifica (Java puro, probado en la JVM)"
fase = "F8"
hito = "1.8"
talla = "M"
ejecutor = "haiku"
depende = ["F5.33"]
toca = ["apps/android/app/src/main/java/dev/publiccode/app/Eventos.java", "apps/android/app/src/test/java/dev/publiccode/app/EventosTest.java", "apps/android/probar-jvm.sh"]
