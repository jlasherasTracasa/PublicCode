async function cierraTerminal(id) {} // mata la orden si sigue en marcha y cierra la pestaña
async function ejecuta(cmd) {}     // lanza en la pestaña activa o escribe en la entrada de su orden en marcha
function escribeSalida(nodo) {}    // añade el texto del nodo al buffer de la pestaña activa
'''
