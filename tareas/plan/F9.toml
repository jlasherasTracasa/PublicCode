[[tarea]]
id = "F9.29f"
nombre = "opencode-barra-lateral"
titulo = "TUI: contenido de la barra lateral (sesión, contexto y archivos tocados), lógica pura"
fase = "F9"
hito = "1.2"
talla = "M"
ejecutor = "haiku"
depende = ["F9.29e"]
toca = ["crates/pcode-tui/src/side.rs", "crates/pcode-tui/src/app.rs", "crates/pcode-tui/src/lib.rs", "crates/pcode-tui/src/i18n.rs"]
acepta = "cargo test -p pcode-tui side::"
contexto = [
  "crates/pcode-tui/src/app.rs (struct `App`, `App::new`, `human_tokens` y `context_percent`)",
  "crates/pcode-core/src/checkpoint.rs (struct `FileChange { path, added, removed, created, deleted }`; se usa como `pcode_core::FileChange`)",
  "crates/pcode-tui/src/theme.rs (estilos `strong()`, `text()`, `dimmed()`, `good()`, `bad()`)",
]
objetivo = '''
Esta tarea prepara los datos y las líneas de la barra lateral; dibujarla en pantalla es F9.29g.
1. `app.rs`: añade a `App` tres campos públicos con su `///`: `title: String` (título de la sesión),
   `changes: Vec<pcode_core::FileChange>` (archivos tocados en la sesión) y `show_side: bool` (barra lateral
   pedida). En `App::new`: `String::new()`, `vec![]` y `false`.
2. `i18n.rs`: añade al final de `ES` y `EN` (mismo orden): `side_session` = `"Sesión"`/`"Session"`,
   `untitled` = `"(sin título)"`/`"(untitled)"`, `side_context` = `"Contexto"`/`"Context"`,
   `side_changes` = `"Cambios"`/`"Changes"`, `none` = `"(ninguno)"`/`"(none)"`.
3. Crea `side.rs` con `SIDE_WIDTH`, `side_visible`, `merge_changes`, `change_row` y `side_lines` (firmas abajo).
4. `merge_changes(all, turn)`: por cada cambio de `turn`, si ya hay uno en `all` con la misma `path` lo
   sustituye; si no, lo añade al final.
5. `change_row(c, width)`: `" <S> <ruta><+a>< −r>"`, con `S` = `A` si `created`, `D` si `deleted`, `M` en otro
   caso; `" +<added>"` solo si `added > 0` y `" −<removed>"` solo si `removed > 0` (el signo es `−`, U+2212).
   Si la fila mide más de `width` caracteres, recorta la ruta por la izquierda y ponle `…` delante hasta que
   quepa (mide con `chars().count()`).
6. `side_lines(app, width)` devuelve, en este orden, una `Line` por fila (cada texto empieza por un espacio):
   título `side_session` (estilo `strong()`); `app.title` o `untitled` si está vacío (recortado a `width - 1`
   caracteres); línea vacía; `side_context` (`strong()`); si `context_limit > 0`,
   `" {used} / {limit} ({pct} %)"` con `human_tokens` y `context_percent`; `" ↑{in} ↓{out} tokens"` con
   `human_tokens` de `app.usage` y la palabra de `t(lang, "tokens")`; línea vacía; `"<side_changes> (<n>)"`
   (`strong()`); después una `change_row` por cambio (como mucho 10; estilo `good()` si `created`, `bad()` si
   `deleted`, `text()` si no) y, si hay más de 10, `" … +<resto>"`; si no hay cambios, `" <none>"` (`dimmed()`).
7. `lib.rs`: añade `pub mod side;`.
'''
firmas = '''
// crates/pcode-tui/src/side.rs
use crate::app::App;
use pcode_core::FileChange;
use ratatui::text::Line;

/// Ancho de la barra lateral, con su borde.
pub const SIDE_WIDTH: u16 = 30;

/// Si la barra lateral se dibuja: está pedida y la terminal mide al menos 70 columnas.
pub fn side_visible(show: bool, width: u16) -> bool;
/// Acumula en `all` los cambios de un turno (sustituye por ruta o añade).
pub fn merge_changes(all: &mut Vec<FileChange>, turn: &[FileChange]);
/// Fila de un archivo tocado, de `width` caracteres como mucho.
pub fn change_row(c: &FileChange, width: u16) -> String;
/// Líneas de la barra lateral para un ancho interior `width`.
pub fn side_lines(app: &App, width: u16) -> Vec<Line<'static>>;
'''
ejemplo = '''
change_row(&FileChange{path:"src/a.rs",added:3,removed:1,created:false,deleted:false}, 29) == " M src/a.rs +3 −1"
change_row(&FileChange{path:"b.rs",added:2,removed:0,created:true,deleted:false}, 29)      == " A b.rs +2"
change_row(ruta "crates/pcode-tui/src/render.rs", +10 −2, ancho 20) mide 20 y contiene "…" y termina en " +10 −2"
side_visible(true, 80) == true; side_visible(true, 69) == false; side_visible(false, 200) == false
side_lines(app sin título ni cambios, 29) como texto:
  " Sesión", " (sin título)", "", " Contexto", " ↑0 ↓0 tokens", "", " Cambios (0)", " (ninguno)"
'''
tests = [
  "fila_de_cambio_con_simbolo_y_contadores: los dos primeros casos del ejemplo y un borrado que empieza por ` D `",
  "fila_larga_recorta_la_ruta_por_la_izquierda: el tercer caso del ejemplo (20 caracteres, con `…`, acaba en ` +10 −2`)",
  "merge_sustituye_por_ruta_y_anade: unir dos turnos que tocan `a.rs` deja una sola entrada de `a.rs` con los datos del segundo, más las nuevas",
  "lineas_sin_datos: el último caso del ejemplo, comparando el texto de cada línea",
  "lineas_con_contexto_y_mas_de_diez_cambios: con límite 160000 y uso 40000 hay una línea ` 40k / 160k (25 %)`; con 12 cambios hay 10 filas y ` … +2`",
  "visible_solo_si_se_pide_y_cabe: los tres casos de `side_visible` del ejemplo",
]
no_hagas = [
  "No toques `render.rs` ni `run.rs` en esta tarea",
  "No hagas E/S (ni git ni disco) en `side.rs`: todo sale de `App`",
]
notas = '''
Para comparar líneas en los tests: `l.spans.iter().map(|s| s.content.as_ref()).collect::<String>()`.
'''

[[tarea]]
id = "F9.29g"
nombre = "opencode-cabecera-lateral"
titulo = "TUI: dibujar la barra lateral (Ctrl+X b) y el título de la sesión en la cabecera"
fase = "F9"
hito = "1.2"
talla = "M"
ejecutor = "haiku"
depende = ["F9.29f"]
toca = ["crates/pcode-tui/src/app.rs", "crates/pcode-tui/src/render.rs", "crates/pcode-tui/src/run.rs"]
acepta = "cargo test -p pcode-tui lateral"
contexto = [
  "crates/pcode-tui/src/side.rs (`SIDE_WIDTH`, `side_visible`, `side_lines`, `merge_changes`)",
  "crates/pcode-tui/src/render.rs (función `render`: el `Layout::vertical` inicial, la barra superior y la transcripción)",
  "crates/pcode-tui/src/run.rs (función `run_tui`, brazo `Msg::Turn`: ahí se leen `a.turn_changes()`)",
  "crates/pcode-tui/src/app.rs (funciones `submit` y `leader_key`)",
]
objetivo = '''
1. `app.rs`, `submit`: justo antes de `self.entries.push(Entry::User(text.clone()))`, si `self.title` está
   vacío, ponle la primera línea de `text` recortada a 40 caracteres (`chars().take(40)`).
2. `app.rs`, `submit`, brazo `"nuevo" | "new"`: además de lo que hace, `self.title.clear()` y
   `self.changes.clear()`.
3. `app.rs`, `leader_key`: añade `Char('b')`: `self.show_side = !self.show_side;` y devuelve `vec![]`.
4. `run.rs`, brazo `Msg::Turn`, dentro del `if let Ok(a) = agent.try_lock()`: guarda `let ch = a.turn_changes();`,
   usa `&ch` en `changes_summary` y añade `crate::side::merge_changes(&mut app.changes, &ch);`.
5. `render.rs`, tras calcular `[header, body, input_area, status]`: si
   `side_visible(app.show_side, area.width)`, parte `body` con
   `Layout::horizontal([Constraint::Min(1), Constraint::Length(SIDE_WIDTH)]).areas(body)` en `[body, side]`
   (vuelve a ligar `body`) y dibuja en `side` un
   `Paragraph::new(side_lines(app, SIDE_WIDTH - 1)).block(Block::new().borders(Borders::LEFT).border_style(th.dimmed()))`.
   Todo lo demás (transcripción, sugerencias, aprobación) sigue usando el `body` ya estrechado.
6. `render.rs`, barra superior: si `app.title` no está vacío, añade a `left` el texto `"  ·  <título>"`,
   recortando el título para que `left + mode + 1 + right` no pase del ancho de `header` (si no cabe ni un
   carácter, no añadas nada).
'''
sin_firmas = "No añade API pública: usa los campos y funciones de F9.29f"
ejemplo = '''
teclear "arregla el test" + Intro           -> app.title == "arregla el test"
teclear "/nuevo" + Intro                    -> app.title == "" y app.changes vacío
Ctrl+X, b                                   -> app.show_side == true; otra vez -> false
pantalla 80×24 con show_side = true         -> alguna fila contiene "Cambios (0)" y la columna 50 de la fila 1 es "│"
pantalla 80×24 con show_side = false        -> ninguna fila contiene "Cambios (0)"
pantalla 60×24 con show_side = true         -> ninguna fila contiene "Cambios (0)" (no cabe)
cabecera con title = "arregla el test"      -> la fila 0 contiene "·  arregla el test"
'''
tests = [
  "lateral_titulo_sale_del_primer_mensaje: tras enviar `arregla el test`, `app.title` es ese texto; un segundo mensaje no lo cambia; `/nuevo` lo vacía",
  "lateral_ctrl_x_b_alterna: Ctrl+X y `b` ponen `show_side` a true y repetirlo lo deja en false",
  "lateral_render_80x24_y_120x40: con `show_side = true`, a 80×24 y a 120×40 hay una fila que contiene `Cambios (0)`; con false, ninguna",
  "lateral_no_se_dibuja_en_60_columnas: a 60×24 con `show_side = true` ninguna fila contiene `Cambios (0)`",
  "lateral_cabecera_muestra_el_titulo: con `app.title = \"arregla el test\"` la fila 0 a 80×24 contiene `·  arregla el test` y sigue acabando en `✓ listo`",
]
no_hagas = [
  "No pongas `show_side` a true por defecto: los tests de render que ya existen dependen del ancho completo",
  "No hagas E/S en `render.rs`",
  "No cambies la firma de `run_tui` ni `TuiOptions`",
