[[tarea]]
id = "F9.19a"
nombre = "openvsx-nucleo"
titulo = "Extensiones: URL de Open VSX y lectura de su respuesta (lógica pura)"
fase = "F9"
hito = "1.2"
talla = "S"
ejecutor = "haiku"
depende = ["F9.05"]
toca = ["crates/pcode-extensions/src/openvsx.rs", "crates/pcode-extensions/src/lib.rs"]
acepta = "cargo test -p pcode-extensions openvsx::"
contexto = [
  "crates/pcode-extensions/src/lib.rs (enum `ExtError`: cómo se declaran los errores; función `parse_package_json`: cómo se lee JSON con `serde_json::Value`)",
]
objetivo = '''
1. `lib.rs`: añade `pub mod openvsx;` después del comentario `//!` inicial, y en `enum ExtError` la variante
   `Remote(String)` con `#[error("Open VSX: {0}")]` y su `///` («El registro no contestó lo esperado»).
2. Crea `openvsx.rs` con lo de *Firmas* y sus tests. Nada de red aquí: solo texto.
3. `parse_id`: parte `id` por el PRIMER punto en espacio de nombres y nombre. Los dos deben tener entre 1 y 100
   caracteres y solo letras ASCII, cifras, `-` y `_` (el nombre admite además `.`). Si no, `None`.
4. `api_url`: `"{base}/api/{namespace}/{name}"`, quitando antes las `/` finales de `base`.
5. `download_of`: `body` es el JSON de esa URL. Lee `version` (cadena) y `files.download` (cadena). Errores, siempre
   `ExtError::Remote(mensaje)`: JSON no válido → `"respuesta no válida"`; si el JSON trae `error` (cadena) → ese
   texto; falta `files.download` → `"la extensión no tiene archivo .vsix"`; la URL de descarga no empieza por
   `base` (sin `/` finales) seguido de `/` → `"descarga fuera del registro: <url>"`. Si falta `version`, usa `""`.
'''
firmas = '''
// crates/pcode-extensions/src/openvsx.rs
//! Registro Open VSX: solo las URL y la lectura de la respuesta (la descarga la hace la CLI).
use crate::ExtError;

/// Registro por defecto.
pub const OPEN_VSX: &str = "https://open-vsx.org";

/// Parte `editor.nombre` en (espacio de nombres, nombre); `None` si no tiene esa forma.
pub fn parse_id(id: &str) -> Option<(String, String)>;

/// URL de los metadatos de la última versión.
pub fn api_url(base: &str, namespace: &str, name: &str) -> String;

/// (versión, URL del `.vsix`) a partir del JSON de `api_url`.
pub fn download_of(body: &str, base: &str) -> Result<(String, String), ExtError>;
'''
ejemplo = '''
parse_id("redhat.java")            -> Some(("redhat", "java"))
parse_id("sin-punto")              -> None
api_url("https://open-vsx.org/", "redhat", "java") -> "https://open-vsx.org/api/redhat/java"
download_of(r#"{"version":"1.2.0","files":{"download":"https://open-vsx.org/api/redhat/java/1.2.0/file/redhat.java-1.2.0.vsix"}}"#,
            "https://open-vsx.org")
   -> Ok(("1.2.0", "https://open-vsx.org/api/redhat/java/1.2.0/file/redhat.java-1.2.0.vsix"))
download_of(r#"{"error":"Extension not found: a.b"}"#, "https://open-vsx.org") -> Err(Remote("Extension not found: a.b"))
'''
tests = [
  "id_con_editor_y_nombre: redhat.java da (redhat, java); sin punto, vacío, con barra o con espacio dan None",
  "url_de_metadatos: la base con barra final da https://open-vsx.org/api/redhat/java",
  "lee_version_y_descarga: el JSON del ejemplo da la versión 1.2.0 y la URL del .vsix",
  "error_del_registro: un JSON con el campo error devuelve ExtError::Remote con ese texto",
  "descarga_de_otro_sitio_se_rechaza: files.download en https://otro.example/x.vsix da Remote que contiene «fuera del registro»",
  "json_roto: la cadena «no es json» da Remote(«respuesta no válida»)",
]
no_hagas = [
  "No uses `reqwest` ni ninguna llamada de red en este crate",
  "No añadas dependencias a `crates/pcode-extensions/Cargo.toml`",
  "No toques las funciones `install`, `list` ni `uninstall`",
]

[[tarea]]
id = "F9.19b"
nombre = "openvsx-instalar"
titulo = "`pcode extensiones instalar editor.nombre`: descargar el .vsix de Open VSX e instalarlo"
fase = "F9"
hito = "1.2"
talla = "M"
ejecutor = "haiku"
depende = ["F9.19a"]
toca = ["crates/pcode-cli/src/ext_remote.rs", "crates/pcode-cli/src/main.rs"]
acepta = "cargo test -p pcode-cli ext_remote::"
contexto = [
  "crates/pcode-cli/src/main.rs (enum `ExtCmd`, función `ext_cmd` y el brazo `Some(Cmd::Extensiones(c))` de `main`)",
  "crates/pcode-cli/src/update.rs (función `get`: cómo se usa `reqwest` con tiempo máximo y errores con `anyhow`)",
  "crates/pcode-extensions/src/openvsx.rs (lo crea F9.19a: `OPEN_VSX`, `parse_id`, `api_url`, `download_of`)",
]
objetivo = '''
1. Crea `ext_remote.rs` con `base_url` y `resolve_source` (firmas abajo) y declara `mod ext_remote;` en `main.rs`
   (en orden alfabético, entre `doctor` y `flow_cmd`).
2. `base_url`: el valor de la variable `PCODE_OPENVSX_URL` si existe y no está vacía; si no,
   `pcode_extensions::openvsx::OPEN_VSX`. Sin `/` al final.
3. `resolve_source(origen, base, tmp)`: si `origen` existe en disco, lo devuelve tal cual (no hay red). Si no existe
   y `parse_id(texto de origen)` da `Some((ns, name))`: hace GET a `api_url(base, ns, name)`, pasa el cuerpo a
   `download_of(cuerpo, base)`, descarga esa URL y la guarda en `tmp/<ns>.<name>-<versión>.vsix`; devuelve esa
   ruta. En cualquier otro caso, error `no existe <origen> ni es un identificador editor.nombre`.
4. Cliente: `reqwest::Client::builder().timeout(Duration::from_secs(60)).build()`. Una respuesta que no sea 2xx en
   los metadatos se pasa igualmente a `download_of` (el registro contesta JSON con `error`); en la descarga es un
   error `descarga fallida: HTTP <código>`. Si el `.vsix` pasa de 64 MiB (`MAX_VSIX`), error `el .vsix es demasiado
   grande`. Antes de pedir nada imprime `Descargando <id> de <base>…` con `eprintln!`.
5. `main.rs`, brazo `Some(Cmd::Extensiones(c))`: antes de llamar a `ext_cmd`, si `c` es `ExtCmd::Instalar { origen }`
   sustituye `origen` por `ext_remote::resolve_source(&origen, &ext_remote::base_url(), &std::env::temp_dir()).await?`.
   En `ExtCmd::Instalar`, cambia el comentario `///` de `origen` a «Archivo `.vsix`, carpeta o `editor.nombre`
   (se descarga de Open VSX)».
6. Tests en `ext_remote.rs` con un servidor HTTP falso en `127.0.0.1:0` hecho con `tokio::net::TcpListener`: acepta
   como mucho 2 conexiones; en cada una lee hasta `\r\n\r\n`, mira la primera línea y contesta
   `HTTP/1.1 200 OK\r\nContent-Length: N\r\nConnection: close\r\n\r\n` más el cuerpo. Para `GET /api/ana/temas`
   el cuerpo es el JSON con `files.download` apuntando a `http://127.0.0.1:<puerto>/f/ana.temas-1.0.0.vsix`; para
   esa otra ruta, los bytes `PK-falso`.
'''
firmas = '''
// crates/pcode-cli/src/ext_remote.rs
//! Descarga de extensiones de Open VSX para `pcode extensiones instalar editor.nombre`.
use std::path::{Path, PathBuf};

/// Tamaño máximo de un `.vsix` descargado.
pub const MAX_VSIX: usize = 64 * 1024 * 1024;

/// Registro que se usa: `PCODE_OPENVSX_URL` o Open VSX.
pub fn base_url() -> String;

/// Devuelve `origen` si existe; si es `editor.nombre`, lo descarga a `tmp` y devuelve la ruta del `.vsix`.
pub async fn resolve_source(origen: &Path, base: &str, tmp: &Path) -> anyhow::Result<PathBuf>;
'''
ejemplo = '''
resolve_source(Path::new("/tmp/mi.vsix"), base, tmp)   (el archivo existe)  -> Ok("/tmp/mi.vsix"), sin red
resolve_source(Path::new("ana.temas"), "http://127.0.0.1:4000", tmp)        -> Ok(tmp/"ana.temas-1.0.0.vsix")
resolve_source(Path::new("no/existe/x"), base, tmp)    -> Err("no existe no/existe/x ni es un identificador editor.nombre")
'''
tests = [
  "origen_local_no_usa_la_red: con un archivo que existe y una base inalcanzable (http://127.0.0.1:1) devuelve la misma ruta",
  "descarga_de_un_servidor_falso: con el servidor falso, ana.temas deja en tmp el archivo ana.temas-1.0.0.vsix con el contenido PK-falso",
  "origen_que_no_existe_ni_es_id: no/existe/x da un error cuyo texto contiene «ni es un identificador»",
  "registro_con_error: si el servidor falso contesta {\"error\":\"no está\"} a los metadatos, el error contiene «no está»",
]
no_hagas = [
  "No cambies la firma de `ext_cmd` ni la hagas `async`",
  "No instales nada en estos tests: `resolve_source` solo descarga; instalar lo sigue haciendo `pcode_extensions::install`",
  "No uses la red real en los tests: solo el servidor falso de 127.0.0.1",
  "No añadas dependencias (`reqwest`, `tokio`, `anyhow` y `tempfile` ya están en el Cargo.toml del crate)",
]

