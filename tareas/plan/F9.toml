[[tarea]]
id = "F9.07"
nombre = "perfil-compilacion-ligero"
titulo = "Perfil de compilación `ligero` para equipos modestos (menos RAM y tiempo que release con LTO)"
fase = "F9"
ejecutor = "haiku"
depende = ["F9.01"]
toca = ["Cargo.toml", "tools/compilar-ligero.sh"]
acepta = "grep -q '^\\[profile.ligero\\]' Cargo.toml && sh -n tools/compilar-ligero.sh && cargo build --profile ligero -p pcode-config"
contexto = ["Cargo.toml (sección [profile.release])", "docs/ligero.md §6"]
objetivo = '''
Compilar release aquí tardó 11 min con picos de 560 MB por proceso. Añade al `Cargo.toml` raíz, debajo de
`[profile.release]`, exactamente:

```toml
# Para compilar en equipos modestos (2 núcleos, 4 GB): sin LTO y en paralelo; binario algo mayor.
[profile.ligero]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
```

Crea `tools/compilar-ligero.sh` (`#!/usr/bin/env sh`, `set -eu`, bit de ejecución) que:
1. Si hay menos de 1500 MB disponibles (`awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo`) usa `-j 1`; si no, `-j 2`.
2. Ejecuta `cargo build --profile ligero -p pcode-cli -p pcode-ide -j "$jobs"`.
3. Imprime `Binarios en target/ligero/: pcode y pcode-ide`.
'''
tests = ["(sin tests unitarios): la aceptación compila con el perfil"]

[[tarea]]
id = "F9.08"
nombre = "ide-numeros-de-linea"
titulo = "IDE: números de línea en el margen y Ctrl+G para ir a una línea"
fase = "F9"
ejecutor = "haiku"
depende = ["F9.05"]
toca = ["crates/pcode-ide/src/state.rs", "crates/pcode-ide/src/app.rs", "crates/pcode-ide/src/texts.rs"]
acepta = "cargo test -p pcode-ide numeros_de_linea && cargo test -p pcode-ide ir_a_linea"
contexto = ["crates/pcode-ide/src/app.rs (función `ui_editor`)", "crates/pcode-ide/src/state.rs"]
objetivo = '''
1. En `state.rs` añade `gutter` y `line_to_byte` (firmas abajo). `gutter("a\nb\nc")` = `"1\n2\n3"`; un texto vacío
   tiene 1 línea; un `\n` final añade una línea más (`"a\n"` → `"1\n2"`). Los números van alineados a la derecha con
   el ancho del mayor (`format!("{:>w$}", n)`). `line_to_byte(text, n)` da el byte donde empieza la línea `n`
   (1 = primera); si `n` pasa del final, `text.len()`; `n == 0` se trata como 1.
2. En `app.rs`, `ui_editor`: dentro del `ScrollArea` del editor, pon un `ui.horizontal_top` con primero un
   `egui::Label` monoespaciado y de color débil (`ui.visuals().weak_text_color()`) con `gutter(&tab.text)` y después
   el `TextEdit` que ya hay. Así se desplazan juntos.
3. Ctrl+G (en `shortcuts`) abre un cuadro pequeño `goto_line: Option<String>` en la barra de estado; al pulsar Intro
   con un número, coloca el cursor con `egui::text::CCursor` en el carácter correspondiente a `line_to_byte` (convierte
   bytes a caracteres con `text[..b].chars().count()`) y cierra el cuadro. Texto nuevo en `Texts`: `go_to_line` (es:
   «Ir a la línea», en: «Go to line»).
'''
firmas = '''
// crates/pcode-ide/src/state.rs
pub fn gutter(text: &str) -> String;
pub fn line_to_byte(text: &str, line: usize) -> usize;
'''
tests = ["numeros_de_linea", "numeros_de_linea_alineados", "ir_a_linea"]

