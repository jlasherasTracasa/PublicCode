nombre = "ide-reemplazar-en-proyecto-nucleo"
titulo = "IDE: reemplazar un texto en una lista de archivos, con lectura y escritura inyectadas (lógica pura)"
fase = "F9"
hito = "1.6"
talla = "S"
ejecutor = "haiku"
depende = ["F9.09"]
toca = ["crates/pcode-ide/src/project_replace.rs", "crates/pcode-ide/src/lib.rs"]
