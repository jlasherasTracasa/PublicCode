[[tarea]]
id = "F9.39a"
nombre = "ide-atajos-nucleo"
titulo = "IDE: leer atajos («Ctrl+Mayús+P») y el archivo `keybindings.toml` (lógica pura)"
fase = "F9"
hito = "1.6"
talla = "M"
ejecutor = "haiku"
